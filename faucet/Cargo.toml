[package]
name = "citrate-faucet"
version = "0.4.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
k256 = { version = "0.13", features = ["ecdsa"] }
rlp = "0.5"
hex = "0.4"
bincode = "1.3"
dashmap = "5"
sha3 = "0.10"
primitive-types = "0.12"
reqwest = { version = "0.12", features = ["json"] }

# Local dependencies
citrate-consensus = { path = "../core/consensus" }
citrate-execution = { path = "../core/execution" }

[features]
default = []
# RM-B1 / WP-E6.2 (audit FAU-02): the deterministic-default seed
# is now gated behind a build-time flag. Local CI / dev contexts
# can opt-in; release builds MUST NOT enable this feature.
unsafe-deterministic-key = []

[dev-dependencies]
tempfile = "3"