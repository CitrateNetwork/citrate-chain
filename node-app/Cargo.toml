[package]
name = "node-app"
version = "0.4.0"
edition = "2021"
license.workspace = true
[features]
# REM-N-03 / WP-H1.2: gate the `--allow-nondeterministic-inference`
# CLI flag behind `dev-mode`. Production / release builds without this
# feature have no surface to opt out of strict inference.
dev-mode = []

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = { workspace = true }
serde = { workspace = true }
axum = "0.7"
prometheus = { version = "0.13", default-features = false }

# Citrate crates
citrate-api = { path = "../core/api" }
citrate-storage = { path = "../core/storage" }
citrate-sequencer = { path = "../core/sequencer" }
citrate-network = { path = "../core/network" }
# PBA-L1a-003: same precompile feature set as citrate-node, so eth_call agrees.
citrate-execution = { path = "../core/execution", features = ["commd-fold-verify"] }
