[package]
name = "citrate-wallet"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "wallet"
path = "src/main.rs"

[dependencies]
# Local dependencies
citrate-consensus = { path = "../core/consensus" }
citrate-execution = { path = "../core/execution" }

# RM-G2.1 (audit CX-01, WAL-03): the canonical keystore lives in
# `citrate-wallet-core::KeyManager`. The legacy `wallet::KeyStore`
# (this crate) is read-only as of RM-G2.1 — the migrator at
# `wallet::keystore::migrate_to_unified_keystore` re-encrypts every
# entry into the wallet-core format. Re-introducing
# `wallet::KeyStore` writes in new code is forbidden by the
# `wal-03-dual-keystore` Semgrep rule.
citrate-wallet-core = { path = "../wallet-core" }

# Crypto
ed25519-dalek = "2.0"
rand = { workspace = true }
sha3 = "0.10"
argon2 = "0.5"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
# Audit finding WAL-04: zeroize secret material on drop.
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# CLI
clap = { version = "4.0", features = ["derive"] }
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
colored = "2.0"

# Utils
tokio = { version = "1.32", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
hex = "0.4"
dirs = "5.0"
chrono = "0.4"
primitive-types = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for RPC
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
argon2 = "0.5"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "coverage_tests"
path = "tests/coverage_tests.rs"

[[test]]
name = "known_answer_tests"
path = "tests/known_answer_tests.rs"

[[test]]
name = "coverage_98"
path = "tests/coverage_98.rs"

[[test]]
name = "rm_g2_1_keystore_migration"
path = "tests/rm_g2_1_keystore_migration.rs"