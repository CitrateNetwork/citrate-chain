[package]
name = "citrate-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
citrate-api = { path = "../core/api" }
citrate-consensus = { path = "../core/consensus" }
bincode = "1.3"
hex = "0.4"

# Prevent this from interfering with workspace
[workspace]
members = ["."]

[[bin]]
name = "fuzz_tx_decoder"
path = "fuzz_targets/fuzz_tx_decoder.rs"
doc = false

[[bin]]
name = "fuzz_block_deser"
path = "fuzz_targets/fuzz_block_deser.rs"
doc = false

[[bin]]
name = "fuzz_rpc_hex"
path = "fuzz_targets/fuzz_rpc_hex.rs"
doc = false
