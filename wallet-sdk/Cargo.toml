[package]
name = "citrate-wallet-sdk"
version = "0.4.0"
edition = "2021"
description = "Citrate wallet SDK — Rust API + WASM bindings for blockchain transactions and identity"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core wallet library
citrate-wallet-core = { path = "../wallet-core" }

# Always needed
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync"] }

# Cryptography exposed to WASM consumers (browser extension, edu webapp).
# Pulled in unconditionally — wallet-core re-exports its dispatcher and
# the `argon2` crate is a tiny no_std-compatible build on wasm32 already.
# WP-A1.5 (audit findings WAL-01, EXT-01).
argon2 = "0.5"

# RM-G1.5 (audit finding EXT-10): expose constant-time secp256k1
# ECDSA signing + public-key derivation via WASM. Replaces the
# hand-rolled BigInt secp256k1 in `wallet-extension/js/crypto.js`.
# Same crate the desktop wallet (wallet-core) already uses, so the
# resulting signatures are byte-for-byte compatible.
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

# WP-A2.3 (audit finding WAL-04): expose Zeroizing<String> for the async
# create_account / recover surfaces.
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# WASM bindings (optional — only for wasm32 target)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }
getrandom = { version = "0.2", optional = true, features = ["js"] }

[features]
default = []
wasm = ["wasm-bindgen", "js-sys", "serde-wasm-bindgen", "web-sys", "getrandom"]
# WP-A1.5: pre-build target for browser-extension Argon2id migration.
# `argon2-wasm` implies `wasm` and adds the `argon2_v2_derive_key` export.
# The full PBKDF2 → Argon2 migration in the extension lands in RM-G1.
argon2-wasm = ["wasm"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
uuid = { version = "1", features = ["v4"] }
