[package]
name = "citrate-wallet-sdk"
version = "0.4.0"
edition = "2021"
description = "Citrate wallet SDK — Rust API + WASM bindings for blockchain transactions and identity"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core wallet library. Only the native `Wallet` (src/wallet.rs) uses it, so
# it is optional and turned on by the `native` feature, with wallet-core's
# own `native` feature (keystore, RPC client). Default features are off so
# that a wasm32 build (`--no-default-features --features wasm`) pulls none
# of wallet-core's tree: its `native` feature brings tokio with mio,
# reqwest and the chain crates, and even its lean `crypto` build needs a
# wasm32 randomness source for uuid and getrandom. src/wasm.rs uses only
# argon2, k256, sha3 and wasm-bindgen. `native` is in `default`, so native
# consumers get the same build as before.
citrate-wallet-core = { path = "../wallet-core", default-features = false, optional = true }

# Always needed
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Only the native `Wallet` (src/wallet.rs) uses tokio.
tokio = { version = "1", features = ["sync"], optional = true }

# Cryptography exposed to WASM consumers (browser extension, edu webapp).
# Pulled in unconditionally — wallet-core re-exports its dispatcher and
# the `argon2` crate is a tiny no_std-compatible build on wasm32 already.
# WP-A1.5 (audit findings WAL-01, EXT-01).
argon2 = "0.5"

# RM-G1.5 (audit finding EXT-10): expose constant-time secp256k1
# ECDSA signing + public-key derivation via WASM. Replaces the
# hand-rolled BigInt secp256k1 in `wallet-extension/js/crypto.js`.
# Same crate the desktop wallet (wallet-core) already uses, so the
# resulting signatures are byte-for-byte compatible.
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

# WP-A2.3 (audit finding WAL-04): expose Zeroizing<String> for the async
# create_account / recover surfaces.
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# WASM bindings (optional — only for wasm32 target)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }

# Every wasm32-unknown-unknown build needs a randomness source for
# getrandom 0.2 (pulled by k256 through rand_core), with or without the
# `wasm` feature, so this is a target dependency rather than part of `wasm`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
# `native` is the Rust API in src/wallet.rs: the on-disk keystore and the
# RPC client. It needs wallet-core's `native` feature and tokio, so it is
# not built for wasm32. Build the WASM bundle with
# `--no-default-features --features wasm`.
default = ["native"]
native = ["dep:citrate-wallet-core", "citrate-wallet-core/native", "dep:tokio"]
wasm = ["wasm-bindgen", "js-sys", "serde-wasm-bindgen", "web-sys"]
# WP-A1.5: pre-build target for browser-extension Argon2id migration.
# `argon2-wasm` implies `wasm` and adds the `argon2_v2_derive_key` export.
# The full PBKDF2 → Argon2 migration in the extension lands in RM-G1.
argon2-wasm = ["wasm"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
uuid = { version = "1", features = ["v4"] }
