# Citrate v3 Testnet Configuration
# WP-S.5: Updated for public testnet launch

[chain]
chain_id = 40204
genesis_hash = ""
block_time = 1  # u64 seconds (config parser requires integer; whitepaper 500ms target)
ghostdag_k = 18

[network]
listen_addr = "0.0.0.0:30303"
bootstrap_nodes = [
    # citrate-bootnode-1 (DigitalOcean nyc1, droplet 560906847).
    # Direct IP because rpc.citrate.ai is Cloudflare-proxied (HTTPS only) —
    # P2P on :30303 won't traverse Cloudflare's TCP proxy. Track-DISCOVERY
    # will replace this with a non-CF subdomain (e.g. boot.citrate.ai)
    # plus an HTTPS-fetched well-known seed list for rotation. Until then,
    # this multiaddr is the canonical bootstrap for chain-id 40204 (testnet beta).
    "noise_24402d5e3009b8004bef53a7a29c4b34138afe4d59cb52e1ba353bb08108eb2e@159.65.227.42:30303",
]
max_peers = 50

[rpc]
enabled = true
listen_addr = "0.0.0.0:8545"
ws_addr = "0.0.0.0:8546"
# PT-10: Default to no CORS for testnet (operators configure per deployment)
# Set to ["*"] only for local development. For production, specify exact origins.
cors_origins = []
# rest_api_key = "" # Uncomment and set for production REST API auth

[storage]
data_dir = ".citrate-testnet"
pruning = false
keep_blocks = 100000

[mining]
enabled = true
coinbase = "4E2380b2f63B2Af3B270611cE779e1Db4CcA64c6000000000000000000000000"
target_block_time = 1
min_gas_price = 1000000000

# VRF configuration — strict cryptographic verification for audit/public testnet
[vrf]
strict_vrf = true
migration_mode = false

# WP-W.2: Checkpoint configuration — BFT committee finality
[checkpoint]
interval = 50
committee_size = 100
quorum_threshold = 67
