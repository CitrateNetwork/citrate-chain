# Citrate v3 Testnet Configuration
# WP-S.5: Updated for public testnet launch

[chain]
chain_id = 40204
genesis_hash = ""
block_time = 1  # u64 seconds (config parser requires integer; whitepaper 500ms target)
ghostdag_k = 18

[network]
listen_addr = "0.0.0.0:30303"
bootstrap_nodes = [
    # Public testnet bootstrap nodes (update with actual addresses)
    # "noise_<pubkey_hex>@boot1.testnet.citrate.network:30303",
    # "noise_<pubkey_hex>@boot2.testnet.citrate.network:30303",
    # "noise_<pubkey_hex>@boot3.testnet.citrate.network:30303",
]
max_peers = 50

[rpc]
enabled = true
listen_addr = "0.0.0.0:8545"
ws_addr = "0.0.0.0:8546"

[storage]
data_dir = ".citrate-testnet"
pruning = false
keep_blocks = 100000

[mining]
# Disabled to let GUI users mine and earn all rewards
# Re-enable this if you want the testnet node to also compete for blocks
enabled = false
coinbase = "4E2380b2f63B2Af3B270611cE779e1Db4CcA64c6000000000000000000000000"
target_block_time = 1
min_gas_price = 1000000000

# WP-W.2: VRF configuration — ECVRF-P256-SHA256 proposer election verification
[vrf]
strict_vrf = true
migration_mode = false

# WP-W.2: Checkpoint configuration — BFT committee finality
[checkpoint]
interval = 50
committee_size = 100
quorum_threshold = 67
