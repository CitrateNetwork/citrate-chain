[package]
name = "citrate-node"
version = "0.4.0"
edition = "2021"
license.workspace = true
[[bin]]
name = "citrate"
path = "src/main.rs"

# WS-5: VALIDATOR-S1 registration ceremony. Derives each fleet node's ed25519
# proposer key from its coinbase (byte-for-byte with src/main.rs), builds the
# on-chain Register digest, ed25519-signs it, and submits registerValidator via
# RPC from a funded staker EOA. Reroll ops tool — not part of the node runtime.
[[bin]]
name = "validator-registration-ceremony"
path = "src/bin/validator_registration_ceremony.rs"

# SRP-S3b diagnostic: bulk-load a data dir's state as node boot does and print a per-account
# digest + reloaded root, to name the account whose persisted representation diverges. Read-only.
[[bin]]
name = "state-digest"
path = "src/bin/state_digest.rs"

[dependencies]
# Local dependencies
citrate-consensus = { path = "../core/consensus" }
# WS-5 ceremony: lean EIP-155 secp256k1 tx signer (crypto feature only — no RPC,
# no consensus/execution pulled through this crate; the staker signs its own
# registerValidator tx for eth_sendRawTransaction).
citrate-wallet-core = { path = "../wallet-core", default-features = false, features = ["crypto"] }
citrate-storage = { path = "../core/storage" }
citrate-execution = { path = "../core/execution" }
citrate-network = { path = "../core/network" }
citrate-sequencer = { path = "../core/sequencer" }
citrate-api = { path = "../core/api" }
citrate-economics = { path = "../core/economics" }
citrate-learning = { path = "../core/learning" }
citrate-mcp = { path = "../core/mcp" }
citrate-wallet = { path = "../wallet" }
citrate-cli = { path = "../cli" }

# External dependencies
tokio = { version = "1.32", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SECREM-01 NET-1/NET-2: byte-budgeting in block_serve.rs.
bincode = { workspace = true }
toml = "0.8"
tracing = "0.1"

# Forces openssl-sys to use the vendored feature across the entire
# build graph (Cargo feature unification). Required for the
# cross-rs debian:bullseye CI image whose system libssl is too old
# for openssl-sys 0.9.114+. See workspace Cargo.toml note.
openssl = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
dirs = "5.0"
hex = "0.4"
chrono = "0.4"
sha2 = "0.10"
sha3 = "0.10"
primitive-types = "0.12"
async-trait = "0.1"
# Enable TLS, multipart uploads (IPFS add), and JSON helpers used in node code
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
rand = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }
# WS-5 ceremony: ed25519 proposer-key derivation + signing the Register digest.
ed25519-dalek = { workspace = true }
# Prometheus-style metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
hyper = { version = "0.14", features = ["server", "http1", "tcp"] }
once_cell = "1.19"
parking_lot = "0.12"
# SECREM-01 CFG-1: wipe Noise P2P key bytes after handoff to the network layer.
zeroize = "1.8"
# Wallet interactive UI deps
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
colored = "2.0"

[dev-dependencies]
tempfile = "3.15"
# WS-5 ceremony fuzz: property-based coverage of proposer-key derivation,
# Register-digest encoding, sign→verify_strict roundtrip, and calldata layout.
proptest = { workspace = true }

[features]
default = []
devnet = []
# WP-B0: build the node with the live Halo2-KZG verifier at 0x0108
# (circuit_version 1 inference / 2 PoRep / 3 PoSt). Without this feature the
# 0x0108 precompile fails closed with a discoverable `SubstrateAbsent` error.
# ALL VALIDATORS MUST AGREE ON THIS FEATURE or they diverge on any
# transaction that exercises 0x0108 — coordinate via a release, never mix.
halo2-verifier = ["citrate-execution/halo2-substrate"]
# citrate-chain#170: build the node with the live recursive-fold CommD verifier at 0x0130 (the sound
# wrong-CommD challenge). Without this feature the precompile fails closed with a discoverable
# "feature absent" error. ALL VALIDATORS MUST AGREE ON THIS FEATURE or they diverge on any transaction
# that exercises 0x0130 — coordinate via a release / reroll, never mix. Requires the baked verifier key
# at core/execution/artifacts/commd_fold_vk.bin (produced by citrate-commd-fold's bake_vk from a
# trusted-setup .ptau).
commd-fold-verify = ["citrate-execution/commd-fold-verify"]
# Feature flag for embedding BGE-M3 model at compile time
# Only needed when creating a new genesis block
# Contributors can build without this feature
embed-genesis-model = []
