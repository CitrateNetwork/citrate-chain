global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Local devnet node
  - job_name: 'citrate-devnet'
    metrics_path: /metrics
    static_configs:
      - targets: ['citrate-node-devnet:9090']
        labels:
          network: devnet

  # Testnet bootstrap nodes (file-based service discovery)
  - job_name: 'citrate-testnet'
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/testnet-*.json
        refresh_interval: 30s

  # Multi-node local cluster
  - job_name: 'citrate-cluster'
    metrics_path: /metrics
    static_configs:
      - targets: ['citrate-node-1:9090','citrate-node-2:9090','citrate-node-3:9090','citrate-node-4:9090','citrate-node-5:9090']
        labels:
          network: cluster
