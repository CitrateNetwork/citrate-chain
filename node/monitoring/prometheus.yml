global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Local devnet node (native, not Docker)
  - job_name: 'citrate-devnet'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9090']  # metrics-bridge.py on host
        labels:
          network: devnet
          instance: local

  # Testnet bootstrap nodes (file-based service discovery)
  - job_name: 'citrate-testnet'
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/testnet-*.json
        refresh_interval: 30s
