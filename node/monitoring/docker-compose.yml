version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: citrate-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts:/etc/prometheus/alerts
      - ./targets:/etc/prometheus/targets
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - citrate-monitoring
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: citrate-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - citrate-monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: citrate-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=lattice123
      - GF_SECURITY_ADMIN_USER=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/testnet-overview.json
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    networks:
      - citrate-monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  citrate-monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
