# WAL-03 / CX-01 — dual-keystore tripwire.
#
# Audit: RM-G2.1 / WAL-03 + CX-01.
#
# Pre-RM-G2.1 the workspace had two parallel keystore
# implementations: `wallet::KeyStore` (CLI, ed25519-only) and
# `citrate-wallet-core::KeyManager` (canonical, ed25519 + secp256k1
# with AAD-bound v2 entries). Any KDF or envelope upgrade had to
# land twice; drift between them caused "my keystore won't open in
# the other tool" support tickets.
#
# Post-RM-G2.1 `wallet::KeyStore` is read-only — used only via the
# `wallet::keystore::migrate_to_unified_keystore` migrator. New
# code MUST use `citrate_wallet_core::KeyManager` for all writes.
#
# This rule fires if any new Rust file outside the legacy wallet
# crate's own internals constructs `KeyStore::new`. The exclude
# list captures the call sites that legitimately read/migrate the
# legacy format.

rules:
  - id: wal-03-dual-keystore-keystore-new
    message: >-
      `wallet::keystore::KeyStore::new` is the legacy CLI keystore
      surface. Use `citrate_wallet_core::KeyManager::new` for new
      keystore writes. To migrate an existing legacy file, call
      `wallet::keystore::migrate_to_unified_keystore`.
      Audit: RM-G2.1 / WAL-03 + CX-01.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "**/*.rs"
      exclude:
        - "wallet/src/keystore.rs"          # the implementation itself
        - "wallet/src/wallet.rs"            # legacy CLI surface (one-shot migration target)
        - "wallet/src/main.rs"              # ditto
        - "wallet/tests/**"                 # legacy tests + migration tests
    patterns:
      - pattern-either:
          - pattern: KeyStore::new($P)
          - pattern: citrate_wallet::keystore::KeyStore::new($P)
          - pattern: crate::keystore::KeyStore::new($P)
      # Don't flag uses of the unrelated `ApiKeyStore` in the gateway,
      # or `EncryptedKeystore` in any other crate.
      - pattern-not: ApiKeyStore::new($P)
      - pattern-not: EncryptedKeystore::new($P)
    metadata:
      audit-id: WAL-03
      severity: high
      sprint: RM-G2
      wp: WP-G2.1
      spec: .agentile/docs/adr/ADR-RM-G2-1-keystore-consolidation.md
