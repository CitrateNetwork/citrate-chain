# GUI-C-04 — MCP host policy must not be trusted from JSON-RPC params.
#
# Audit finding (HIGH):
#   .audit/2026-04-24-full-repo-adversarial-audit/07_FINDINGS_GUIS.md#gui-c-04
#
# Spec (canonical):
#   .agentile/planset/REMEDIATION_2026_04_24/14_PHASE_RM_E_GUI_AGENT.md
#   §"Sprint RM-E1 — MCP host auth + initialize consent"
#
# Pre-fix `handle_initialize` in `gui/citrate_desktop_app/src/services/mcp_host.rs`
# read the policy directly from `params.get("policy")` and built a
# `CapabilityGrant` at that level — letting any local process claim
# `Maintainer`. Post-fix the policy is bounded by an operator-issued
# `auth_token` looked up in `McpHostService::lookup_active_token`.
#
# This rule fires on direct `params.get("policy")` reads in mcp_host
# handlers that do NOT also reference `lookup_active_token` or
# `cap_policy` in the same function body. The fixed implementation
# pairs the policy parse with token lookup and capping; an attempt
# to revert that pairing trips this gate.

rules:
  - id: gui-c-04-mcp-policy-trusted-from-caller
    message: >-
      MCP `handle_initialize` must bound the granted policy by an
      operator-issued auth_token via `lookup_active_token` + `cap_policy`.
      Reading `params.get("policy")` without the token check re-introduces
      audit GUI-C-04 (caller-trusted privilege escalation). See
      .agentile/planset/REMEDIATION_2026_04_24/14_PHASE_RM_E_GUI_AGENT.md.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "gui/citrate_desktop_app/src/services/mcp_host.rs"
      exclude:
        - "**/tests/**"
        - "**/*_test.rs"
        - "**/*_tests.rs"
    patterns:
      - pattern: |
          fn $FN(...) $RET {
            ...
            $POLICY = params.get("policy")...;
            ...
          }
      - pattern-not: |
          fn $FN(...) $RET {
            ...
            $POLICY = params.get("policy")...;
            ...
            $TOK = ... lookup_active_token ...;
            ...
          }
    metadata:
      audit-id: GUI-C-04
      severity: high
      sprint: RM-E1
      wp: WP-E1.3
      spec: .agentile/planset/REMEDIATION_2026_04_24/14_PHASE_RM_E_GUI_AGENT.md
      reference: https://owasp.org/www-community/Broken_Access_Control
