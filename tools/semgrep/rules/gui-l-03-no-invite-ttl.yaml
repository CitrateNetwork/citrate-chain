# GUI-L-03 — Edu invite codes must carry an expiry timestamp.
#
# Audit finding (MEDIUM):
#   .audit/2026-04-24-full-repo-adversarial-audit/07_FINDINGS_GUIS.md#gui-l-03
#
# Spec (canonical):
#   .agentile/planset/REMEDIATION_2026_04_24/14_PHASE_RM_E_GUI_AGENT.md
#   §"Sprint RM-E3 — Edu encryption + invite TTL + teacher re-auth"
#
# Pre-fix `ClassroomRegistry::enrollWithCode` (now `enrollWithInvite`) and
# `LearningPool::joinWithInvite` accepted any active invite code with
# no notion of expiry. A leaked code from January was just as good as
# one minted yesterday.
# Post-fix both contracts populate `inviteExpiresAt` on every code mint
# and require `block.timestamp <= expiresAt` at use time.
#
# This rule fires when an enroll/join function reads an invite code
# without checking `inviteExpiresAt`. It's a compile-time tripwire
# against the variant a regression would re-introduce.

rules:
  - id: gui-l-03-no-invite-ttl-classroom
    message: >-
      `ClassroomRegistry.enrollWithInvite` must check `inviteExpiresAt`
      before linking the student (audit GUI-L-03). See
      .agentile/planset/REMEDIATION_2026_04_24/14_PHASE_RM_E_GUI_AGENT.md.
    languages: [solidity]
    severity: ERROR
    paths:
      include:
        - "contracts/src/ClassroomRegistry.sol"
    patterns:
      # PBA-L2-010: enrolment moved from enrollWithCode(bytes) (raw code in
      # calldata, replayable) to enrollWithInvite(address, bytes).
      - pattern: |
          function enrollWithInvite($K, $S) external {
            ...
          }
      - pattern-not: |
          function enrollWithInvite($K, $S) external {
            ...
            inviteExpiresAt[$H]
            ...
          }
    metadata:
      audit-id: GUI-L-03
      severity: medium
      sprint: RM-E3
      wp: WP-E3.1
      spec: .agentile/planset/REMEDIATION_2026_04_24/14_PHASE_RM_E_GUI_AGENT.md

  - id: gui-l-03-no-invite-ttl-pool
    message: >-
      `LearningPool.joinWithInvite` must check `inviteExpiresAt`
      before admitting the joiner (audit GUI-L-03).
    languages: [solidity]
    severity: ERROR
    paths:
      include:
        - "contracts/src/LearningPool.sol"
    patterns:
      - pattern: |
          function joinWithInvite($P, $H) external payable poolExists($P) {
            ...
          }
      - pattern-not: |
          function joinWithInvite($P, $H) external payable poolExists($P) {
            ...
            inviteExpiresAt[$P][$H]
            ...
          }
    metadata:
      audit-id: GUI-L-03
      severity: medium
      sprint: RM-E3
      wp: WP-E3.2
      spec: .agentile/planset/REMEDIATION_2026_04_24/14_PHASE_RM_E_GUI_AGENT.md
