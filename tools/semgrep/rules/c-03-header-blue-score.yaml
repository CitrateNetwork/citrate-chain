# C-03 — Reading `header.blue_score` for ordering / consensus is forbidden.
#
# Audit finding (CRITICAL):
#   .audit/2026-04-24-full-repo-adversarial-audit/03_FINDINGS_CONSENSUS_EXECUTION.md#c-03
#
# Pre-fix `core/consensus/src/ordering.rs` sorted the mergeset by
# `b.header.blue_score` — proposer-supplied. A malicious proposer
# could stuff `u64::MAX` into the header to bias ordering and
# enable MEV / sandwich attacks. Post-fix the ordering uses
# `ghostdag.calculate_blue_score(&b)` (locally recomputed).
#
# Reading `header.blue_score` is fine for diagnostics, RPC
# responses, and the integrity check. It's NOT fine for ordering,
# tip selection, or finality.

rules:
  - id: c-03-header-blue-score-in-ordering
    message: >-
      Sorting / comparing on `block.header.blue_score` is
      forbidden in consensus paths (C-03). The header value is
      proposer-supplied. Use `ghostdag.calculate_blue_score(&b)`
      for the locally-recomputed value.
      See specs/tla/consensus/GhostDAGSafety.tla.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "core/consensus/src/ordering.rs"
        - "core/consensus/src/tip_selection.rs"
        - "core/consensus/src/chain_selection.rs"
      exclude:
        - "**/tests/**"
        - "**/proptest-regressions/**"
    patterns:
      - pattern-either:
          - pattern: |
              $X.sort_by_key(|$_| $_.header.blue_score)
          - pattern: |
              $X.sort_by(|$A, $B| $B.header.blue_score.cmp(&$A.header.blue_score))
          - pattern: |
              $X.sort_by(|$A, $B| $A.header.blue_score.cmp(&$B.header.blue_score))
