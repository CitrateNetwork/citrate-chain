# GUI-B-01 — buyer-webapp must not re-introduce a `lib/devSigner.ts`.
#
# Audit finding (MEDIUM):
#   .audit/2026-04-24-full-repo-adversarial-audit/07_FINDINGS_GUIS.md#gui-b-01
#
# Spec (canonical):
#   .agentile/planset/REMEDIATION_2026_04_24/14_PHASE_RM_E_GUI_AGENT.md
#   §"Sprint RM-E6 — Faucet + buyer-webapp + GUI-B"
#
# Pre-fix `buyer-webapp/lib/devSigner.ts` shipped in production
# bundles. A user could paste a private key into a browser textbox
# and "sign" transactions — the audit flagged this as a foot-gun
# (screen-share or phishing leaks the key trivially).
#
# Phase E first reduced the risk via an `isProductionBuild()` runtime
# gate. The follow-on cleanup (this commit lives alongside)
# DELETED `lib/devSigner.ts` outright; tests use
# `__tests__/fixtures/MockSigner.ts` directly. Production code must
# not import a `devSigner` module under any path.
#
# This rule fires when:
#   - any file under `buyer-webapp/lib/` exports a function named
#     `setDevSigner`, `readDevSigner`, or `clearDevSigner`; OR
#   - any production source imports from `./devSigner` /
#     `@/lib/devSigner`.

rules:
  - id: gui-b-01-devsigner-export
    message: >-
      `buyer-webapp/lib/devSigner.ts` was deleted (audit GUI-B-01).
      Tests that need a quick signer use
      `__tests__/fixtures/MockSigner.ts`. Don't re-export a
      production-bundled DevSigner module. See
      .agentile/planset/REMEDIATION_2026_04_24/14_PHASE_RM_E_GUI_AGENT.md.
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "buyer-webapp/lib/**/*.ts"
        - "buyer-webapp/lib/**/*.tsx"
      exclude:
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.test.tsx"
    pattern-either:
      - pattern: |
          export function setDevSigner($PK: string): $T { ... }
      - pattern: |
          export function readDevSigner(): $T { ... }
      - pattern: |
          export function clearDevSigner(): $T { ... }

  - id: gui-b-01-devsigner-import
    message: >-
      Production code in `buyer-webapp` must not import from
      `./devSigner` or `@/lib/devSigner` — that module was deleted in
      audit GUI-B-01 cleanup. Tests use
      `__tests__/fixtures/MockSigner.ts`.
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - "buyer-webapp/**/*.ts"
        - "buyer-webapp/**/*.tsx"
      exclude:
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "buyer-webapp/__tests__/**"
    pattern-either:
      - pattern: |
          import $X from './devSigner';
      - pattern: |
          import { ... } from './devSigner';
      - pattern: |
          import $X from '@/lib/devSigner';
      - pattern: |
          import { ... } from '@/lib/devSigner';
    metadata:
      audit-id: GUI-B-01
      severity: medium
      sprint: RM-E6
      wp: WP-E6.4
      spec: .agentile/planset/REMEDIATION_2026_04_24/14_PHASE_RM_E_GUI_AGENT.md
