[package]
name = "citrate-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Production-correct TPS benchmark for the Citrate testnet. Not a devnet load toy."
license = "MIT OR Apache-2.0"

[[bin]]
name = "citrate-bench"
path = "src/main.rs"

[lib]
name = "citrate_bench"
path = "src/lib.rs"

[dependencies]
# Signing and hashing
k256 = { version = "0.13", features = ["ecdsa", "ecdsa-core"] }
sha2 = "0.10"
sha3 = "0.10"
rlp = "0.5"
hex = "0.4"

# Keystore V3 decryption
eth-keystore = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime (runner rate limiter + Phase 3+ RPC client)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# CLI and error handling
clap = { version = "4", features = ["derive"] }
thiserror = "1"

# Security
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"

[dev-dependencies]
tempfile = "3"
rand = "0.8"

[workspace]
# Standalone crate: NOT a member of the main citrate workspace.
# Matches the posture of tests/load — dedicated bench tooling lives outside
# the main build graph so its dependency churn never blocks core crate work.
# See .agentile/quorum/16_POST_CEREMONY_BENCHMARK_HARNESS_SPEC.md.
