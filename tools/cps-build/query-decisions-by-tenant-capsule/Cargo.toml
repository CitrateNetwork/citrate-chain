# CIT-AGENT-9c-2 — query-decisions-by-tenant capsule source.
#
# Two-call capsule: latestByTenant(bytes32, uint256) → bytes32[],
# then getDecision(bytes32) per ID. Decodes the dynamic-struct
# return into a structured WIT decision-summary list.

[package]
name = "query-decisions-by-tenant-capsule"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.36", features = ["bitflags"] }
sha3 = { version = "0.10", default-features = false }

[package.metadata.component]
package = "citrate:query-decisions-by-tenant"

[package.metadata.component.target]
path = "wit"
world = "query-decisions-by-tenant"

[package.metadata.component.target.dependencies]
"citrate:chain" = { path = "wit/deps/chain" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
