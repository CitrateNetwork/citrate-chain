[package]
name = "anchor-session-capsule"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.36", features = ["bitflags"] }
sha3 = { version = "0.10", default-features = false }

[package.metadata.component]
package = "citrate:anchor-session"

[package.metadata.component.target]
path = "wit"
world = "anchor-session"

[package.metadata.component.target.dependencies]
"citrate:chain" = { path = "wit/deps/chain" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
