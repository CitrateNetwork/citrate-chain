[package]
name = "citrate-mergeset-ref"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Independent reference executor for r1007 mergeset acceptance (S3-3b/S3-3c, spec 06 §3 and §8.3): GHOSTDAG coloring, the consensus order, outcome classes, settlement and the four commitments, computed from block data alone. It never imports citrate_consensus::{ghostdag, ordering}, citrate_execution's executor or the node; it shares only the block and transaction types, transaction authentication and the state-trie hash."

[lib]
name = "citrate_mergeset_ref"
path = "src/lib.rs"

[dependencies]
# Trusted base only (spec 06 §8.3): block/tx types and tx authentication
# (citrate-consensus types + tx_auth), and the state-trie hash
# (citrate_execution::StateDB::calculate_state_root_with).
citrate-consensus = { path = "../../core/consensus" }
citrate-execution = { path = "../../core/execution" }
primitive-types = "0.12"
sha3 = { workspace = true }
hex = "0.4"
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
