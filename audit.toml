# cargo-audit configuration
# REM-13b tripwire — 2026-05-20 federation-split audit
#
# Per the SOP at citrate-agentile-archive/sops/vulnerability-scanning.md
# every dep advisory must either be (a) closed by a dep bump/removal,
# or (b) ignored here with a documented REM tracker + reason.
#
# cargo-audit reads ~/.cargo/audit.toml NOT project-local, so the
# actual ignore list is passed via --ignore flags in
# .github/workflows/cargo-audit.yml. This file is the documentation
# source-of-truth for assessors.

[advisories]
ignore = [
    # ─────────────────────────────────────────────────────────────────
    # ruint Uint shift flags (fp-check verified NOT EXPLOITABLE) 2026-08-03
    # ─────────────────────────────────────────────────────────────────
    # RUSTSEC-2026-0220 — ruint 1.12.4 `overflowing_shl`/`overflowing_shr`
    # return false-negative overflow flags; `checked_*` return Some instead
    # of None, `strict_*` fail to panic, `saturating_*` wrap. Separately
    # `wrapping_sh*` truncate the shift amount mod 2^32, and `to_base_be`
    # can loop forever on NO-ALLOC builds.
    # fp-check verdict: NOT EXPLOITABLE for citrate-chain.
    # Evidence:
    #   1. The advisory states the SHIFTED VALUES were correct — only the
    #      flag was wrong. Consensus arithmetic reads values, not flags.
    #   2. revm's EVM shift opcodes clamp `shift < 256` and then use plain
    #      `<<` / `>>` / `arithmetic_shr` — never the checked/saturating
    #      family (revm-interpreter-6.0.0/src/instructions/bitwise.rs
    #      :83-118, verified by reading the vendored source). The >= 2^32
    #      truncation is unreachable for the same reason.
    #   3. citrate-chain calls NO affected API in first-party source
    #      (core/, node/, cli/) — enforced going forward by
    #      scripts/ci/ruint_shift_advisory_premise_tripwire.sh, which fails
    #      the build if one appears, so this justification cannot be
    #      silently inherited by future code.
    #   4. The to_base_be infinite loop is documented as no-alloc only; we
    #      build std binaries and never call it.
    # Not closable yet: the fix is ruint >= 1.20.0, which requires proptest
    # with the `no_std` feature -> proptest 1.11+ -> rand 0.9. proptest is
    # pinned `=1.5.0` workspace-wide (Cargo.toml:134-137) pending the rand
    # 0.8 -> 0.9 migration, BACKLOG #124. The newest ruint satisfying that
    # pin is 1.11.0, which is still vulnerable, so no partial bump helps.
    # Closes mechanically when BACKLOG #124 lands.
    "RUSTSEC-2026-0220",

    # ─────────────────────────────────────────────────────────────────
    # REM-14 — ruint reciprocal_mg10 (fp-check verified FALSE POSITIVE)
    # ─────────────────────────────────────────────────────────────────
    # RUSTSEC-2025-0137 — ruint 1.12.4 release-mode OOB read on TABLE
    # when caller violates the `d >= 2^63` precondition.
    # fp-check verdict: FALSE POSITIVE for citrate-chain.
    # Evidence: alloy-primitives' Uint::div_rem always normalizes the
    # divisor via `<< leading_zeros()` before invoking reciprocal_mg10
    # (ruint-1.12.4/src/algorithms/div/small.rs:57-62). citrate-chain
    # has zero direct `use ruint::*` imports. Closes mechanically when
    # alloy-primitives bumps ruint; tracked as REM-14 hygiene.
    # See: per-repo/citrate-chain/F-06_FP_CHECK.md + evidence/F-06_negative_poc.{md,rs,sh}
    "RUSTSEC-2025-0137",

    # ─────────────────────────────────────────────────────────────────
    # REM-16b — tracing-subscriber 0.2.25 via arkworks (deferred)
    # ─────────────────────────────────────────────────────────────────
    # RUSTSEC-2025-0055 — tracing-subscriber <0.3.20 ANSI escape
    # injection (CWE-117 log injection).
    # fp-check verdict: TRUE POSITIVE Low.
    #
    # REM-16a (closed by audit framing): direct deps in this repo's
    # Cargo.toml are already on "0.3" everywhere; the audit's
    # original "workspace 0.2→0.3 bump" recommendation was based on
    # stale lockfile data.
    #
    # REM-16b (deferred — the actual remaining work): the vulnerable
    # 0.2.25 in the lockfile is pulled transitively by ark-relations
    # 0.4.0's `std` feature (ark-groth16 0.4 → ark-crypto-primitives
    # 0.4 → ark-relations 0.4 → tracing-subscriber 0.2 when std is
    # on, which is the default). Closing requires bumping arkworks
    # 0.4 → 0.6 across the chain dep tree — a cryptographic
    # compatibility decision needing ZK-engineering review.
    # See: per-repo/citrate-chain/F-08_FP_CHECK.md
    "RUSTSEC-2025-0055",
]

# ─── Unmaintained-warning ignores (REM-21 hygiene) ─────────────────
# These appear as `warning:` in cargo-audit output and don't fail
# the build under the default policy. Tracked under REM-21 for
# rolling replacement (bincode→postcard, derivative→std,
# instant→std::time, net2→socket2, paste→pastey, etc.).
