[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["*"]
evm_version = "cancun"
# Deterministic init_code for CREATE2 reroll-stable addresses (see script/Salts.sol):
# strip the trailing solc metadata hash so creationCode is byte-reproducible and
# independent of source-path/metadata noise. Pinned — changing these moves every address.
bytecode_hash = "none"
cbor_metadata = false

[rpc_endpoints]
citrate = "http://localhost:8545"
citrate_testnet = "https://rpc.citrate.ai"

[etherscan]
citrate = { key = "${ETHERSCAN_API_KEY}" }

# Citrate-specific configurations
[profile.citrate]
via_ir = true
optimizer = true
optimizer_runs = 10000
