name: Publish wallet-aa to crates.io

# Publishes the citrate-wallet-aa crate (ERC-4337 account-abstraction helpers,
# MIT OR Apache-2.0, zero path deps) on a `wallet-aa-v<version>` tag or manual
# dispatch. Requires the CARGO_REGISTRY_TOKEN secret. Only wallet-aa is published
# here; wallet-core/wallet-sdk/cli have path deps and publish separately (see the
# DevX publish runbook). fed-types stays BUSL-1.1 / unpublished.

on:
  push:
    tags:
      - 'wallet-aa-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Verify crate version matches the tag
        if: startsWith(github.ref, 'refs/tags/wallet-aa-v')
        run: |
          CRATE_VERSION=$(grep -m1 '^version' wallet-aa/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF#refs/tags/wallet-aa-v}"
          if [ "$CRATE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::wallet-aa/Cargo.toml version ($CRATE_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Dry-run package (verify it builds standalone)
        run: cargo publish -p citrate-wallet-aa --dry-run

      - name: Publish to crates.io
        run: cargo publish -p citrate-wallet-aa
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
