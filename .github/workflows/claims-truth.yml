name: claims-truth

# Public-claims tripwire. Public claims must agree with the
# code and the committed getCode snapshot:
#  - verification/check_claims.py: checkpoint finality cannot be claimed as running
#    unless both compiled pins (voting + enforcement) are ON for 40204 and a production
#    sign + outbound-broadcast path exists (tests: verification/tests); public READMEs cannot
#    describe finality as current, quote codeless/stale addresses, stale counts,
#    dead hosts, or curl|bash from mutable main.
#  - verification/check_address_code.py --offline: claims.json deployed_contracts
#    matches the committed eth_getCode snapshot and the current address book.
# The live sweep (check_address_code.py --check, read-only RPC) runs weekly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Claims vs code (offline)
        run: python3 verification/check_claims.py
      - name: Claims tripwire (unit tests)
        run: python3 -m unittest discover -s verification/tests -v
      - name: Deployed-contract count vs getCode snapshot (offline)
        run: python3 verification/check_address_code.py --offline
      - name: Address-book tools (unit tests, loopback only)
        # HUP-S7.1: scripts/ops/hup-book-update.py guards what the operator writes into
        # contracts/addresses/40204.json; its tests use a loopback fake RPC, no network.
        run: python3 -m unittest discover -s scripts/ops/tests -p 'test_*.py' -v
      - name: Producer operator tools (unit tests, loopback only)
        # C3-P: scripts/producers/ (preflight, config generator, registration tx builder,
        # post-join verifier, and the runbook's node install block run against good and
        # bad release fixtures). Fake RPC on 127.0.0.1 and a fake host root; no network.
        run: python3 -m unittest discover -s scripts/producers/tests -p 'test_*.py' -v
      - name: Height watchdog pause/resume (hermetic shell test)
        run: bash scripts/ops/tests/test_height_watchdog.sh
      - name: Live getCode sweep (read-only RPC, scheduled only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 verification/check_address_code.py --check
