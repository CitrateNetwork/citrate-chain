name: cargo audit (tripwire)

# REM-13b tripwire (2026-05-20 federation-split audit):
# Catches regression of the closed F-05 (rustls-webpki) advisory
# cluster (closed by deleting the dead ethers-solc dep tree) and
# surfaces new advisories early. Runs per-PR + weekly per the cadence
# in citrate-agentile-archive/sops/vulnerability-scanning.md.
#
# Failure policy:
#   * `cargo audit` fails on any unallowed advisory.
#   * Known-deferred advisories listed in `audit.toml` with REM
#     tracker references; the actual ignore list (with expiries) lives
#     in scripts/ci/audit_all_lockfiles.sh (cargo-audit reads only
#     ~/.cargo/audit.toml, not project-local).
#   * Adding an ignore there requires a deliberate PR that
#     points at an open REM tracker.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-audit-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: RUSTSEC-2026-0387 ignore guard (blocking)
        # Fails when the reason for the 0387 ignore stops being true (a new
        # crypto-bigint < 0.7.6 user, a stale ignore, or the expiry passing).
        run: |
          python3 scripts/ci/check_crypto_bigint_users.py --self-test
          python3 scripts/ci/check_crypto_bigint_users.py

      - name: Lockfile audit self-test (negative + positive control)
        # Proves the gate still flags a lockfile pinned to a vulnerable
        # version, passes the patched one, and fails on an expired ignore.
        # A blind audit is worse than none.
        run: scripts/ci/audit_all_lockfiles.sh --self-test

      - name: Run cargo audit on every tracked Cargo.lock
        # The only cargo-audit invocation in CI. Audits the root lockfile AND
        # every sub-lockfile (fuzz/, tests/load/, tools/citrate-bench/,
        # core/federated/, standalone crates), enumerated from
        # `git ls-files '*Cargo.lock'`. The accepted-advisory ignore list, with
        # its REM trackers and expiries, lives in that script (single source of
        # truth) and is documented for assessors in audit.toml. Failure is the
        # tripwire.
        run: scripts/ci/audit_all_lockfiles.sh
