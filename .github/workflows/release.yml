name: Release (Developer Bundles + GUI + Learning Center)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish or rebuild (for example: v0.3.0-rc.2)'
        required: true
        type: string
      publish_release:
        description: 'Publish immediately instead of creating a draft release'
        required: false
        default: false
        type: boolean
      supersede_old_prereleases:
        description: 'Mark v0.3.0-beta.4 and v0.3.0-rc.1 as superseded after publishing'
        required: false
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true && 'false' || 'true' }}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# RM-B1 / WP-F1.1 (audit CI-01): minimum permissions at workflow level.
# The publish job widens to `contents: write` for the GitHub Release.
permissions:
  contents: read

jobs:
  build-developer-bundles:
    name: Build Developer Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: citrate_v0.01.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-${{ matrix.os }}-${{ hashFiles('citrate_v0.01.1/Cargo.lock') }}
          restore-keys: release-${{ matrix.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install llvm cmake -y

      - name: Build release binaries
        # RM-B1 / WP-F1.4 (audit REL-05): --locked for reproducible
        # builds. Same Cargo.lock = same binary checksums.
        run: |
          cargo build --locked --release -p citrate-node -p citrate-cli -p citrate-wallet -p citrate-faucet

      - name: Package developer bundle (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          case "$(uname -s)" in
            Linux) OS=linux ;;
            Darwin) OS=macos ;;
            *) OS=$(uname -s | tr '[:upper:]' '[:lower:]') ;;
          esac
          ARCH=$(uname -m)
          STAGE="dist/citrate-developer-${OS}-${ARCH}"
          mkdir -p "${STAGE}"
          cp target/release/citrate "${STAGE}/"
          cp target/release/citrate-cli "${STAGE}/"
          cp target/release/wallet "${STAGE}/citrate-wallet"
          cp target/release/citrate-faucet "${STAGE}/"
          cp ../LICENSE "${STAGE}/"
          cp README.md "${STAGE}/"
          cp CHANGELOG.md "${STAGE}/"
          cp ../RELEASE_PACKAGE_MATRIX.md "${STAGE}/"
          cp ../PRECOMPILE_DEVELOPER_CHEATSHEET.md "${STAGE}/"
          cd "${STAGE}"
          if command -v sha256sum &>/dev/null; then
            sha256sum citrate citrate-cli citrate-wallet citrate-faucet > SHA256SUMS.txt
          else
            shasum -a 256 citrate citrate-cli citrate-wallet citrate-faucet > SHA256SUMS.txt
          fi
          cd ..
          tar -czf "citrate-developer-${OS}-${ARCH}.tar.gz" "citrate-developer-${OS}-${ARCH}"
          rm -rf "citrate-developer-${OS}-${ARCH}"
          echo "Created dist/citrate-developer-${OS}-${ARCH}.tar.gz"

          if [[ "$OS" == "linux" ]]; then
            # Rename wallet → citrate-wallet so the .deb installs
            # /usr/bin/citrate-wallet (matches the tarball naming).
            cp target/release/wallet target/release/citrate-wallet
            ../scripts/release/build_deb.sh \
              --binary target/release/citrate \
              --binary target/release/citrate-cli \
              --binary target/release/citrate-wallet \
              --binary target/release/citrate-faucet \
              --package citrate-developer \
              --version "${RELEASE_TAG}" \
              --arch "${ARCH}" \
              --output-dir dist \
              --description "Citrate node, CLI, wallet, and faucet — full developer bundle" \
              --doc ../LICENSE \
              --doc README.md \
              --doc CHANGELOG.md \
              --doc ../RELEASE_PACKAGE_MATRIX.md \
              --doc ../PRECOMPILE_DEVELOPER_CHEATSHEET.md
          fi

      - name: Package developer bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist\citrate-developer-windows-$env:PROCESSOR_ARCHITECTURE"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\citrate.exe $stage\
          Copy-Item target\release\citrate-cli.exe $stage\
          Copy-Item target\release\wallet.exe "$stage\citrate-wallet.exe"
          Copy-Item target\release\citrate-faucet.exe $stage\
          Copy-Item ..\LICENSE $stage\
          Copy-Item README.md $stage\
          Copy-Item CHANGELOG.md $stage\
          Copy-Item ..\RELEASE_PACKAGE_MATRIX.md $stage\
          Copy-Item ..\PRECOMPILE_DEVELOPER_CHEATSHEET.md $stage\
          $hashTargets = @(
            "$stage\citrate.exe",
            "$stage\citrate-cli.exe",
            "$stage\citrate-wallet.exe",
            "$stage\citrate-faucet.exe"
          )
          $hashLines = foreach ($file in $hashTargets) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $hashLines | Set-Content "$stage\SHA256SUMS.txt"
          $arch = $env:PROCESSOR_ARCHITECTURE
          $zip = "dist\citrate-developer-windows-$arch.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          Remove-Item $stage -Recurse -Force
          Write-Host "Created $zip"

      - name: Upload developer bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: developer-${{ matrix.os }}
          path: citrate_v0.01.1/dist/*
          if-no-files-found: warn

  build-core-gui:
    name: Build Core GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: citrate_v0.01.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: gui-${{ matrix.os }}-${{ hashFiles('citrate_v0.01.1/Cargo.lock') }}
          restore-keys: gui-${{ matrix.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libclang-dev cmake pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install llvm cmake -y

      - name: Build Slint GUI binary
        # WP-I2.4 (audit CI-08, re-audit Stream 7): --locked enforces
        # the committed Cargo.lock so a transient registry hiccup or a
        # malicious lockfile-bumping action can't silently change a
        # dependency in a release artefact.
        run: cargo build --locked --release -p citrate-gui-native

      - name: Package core GUI artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          case "$(uname -s)" in
            Linux) OS=linux ;;
            Darwin) OS=macos ;;
            *) OS=$(uname -s | tr '[:upper:]' '[:lower:]') ;;
          esac
          ARCH=$(uname -m)
          STAGE="dist/citrate-gui-native-${OS}-${ARCH}"
          mkdir -p "${STAGE}"
          cp target/release/citrate-gui-native "${STAGE}/"
          cp ../LICENSE "${STAGE}/"
          cp gui/citrate_gui_native/README.md "${STAGE}/"
          cp README.md "${STAGE}/PROJECT_README.md"
          cp ../RELEASE_PACKAGE_MATRIX.md "${STAGE}/"
          cd "${STAGE}"
          if command -v sha256sum &>/dev/null; then
            sha256sum citrate-gui-native > SHA256SUMS.txt
          else
            shasum -a 256 citrate-gui-native > SHA256SUMS.txt
          fi
          cd ..
          tar -czf "citrate-gui-native-${OS}-${ARCH}.tar.gz" "citrate-gui-native-${OS}-${ARCH}"
          rm -rf "citrate-gui-native-${OS}-${ARCH}"

          if [[ "$OS" == "linux" ]]; then
            ../scripts/release/build_deb.sh \
              --binary target/release/citrate-gui-native \
              --package citrate-gui-native \
              --version "${RELEASE_TAG}" \
              --arch "${ARCH}" \
              --output-dir dist \
              --description "Citrate core desktop GUI" \
              --doc ../LICENSE \
              --doc README.md \
              --doc gui/citrate_gui_native/README.md \
              --doc ../RELEASE_PACKAGE_MATRIX.md \
              --icon gui/citrate_gui_native/assets/images/citrate-icon.png \
              --desktop-name "Citrate Core GUI" \
              --desktop-comment "Citrate core desktop GUI"
          fi

      - name: Package core GUI artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist\citrate-gui-native-windows-$env:PROCESSOR_ARCHITECTURE"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\citrate-gui-native.exe $stage\
          Copy-Item ..\LICENSE $stage\
          Copy-Item gui\citrate_gui_native\README.md $stage\
          Copy-Item README.md "$stage\PROJECT_README.md"
          Copy-Item ..\RELEASE_PACKAGE_MATRIX.md $stage\
          $hash = (Get-FileHash "$stage\citrate-gui-native.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  citrate-gui-native.exe" | Set-Content "$stage\SHA256SUMS.txt"
          $arch = $env:PROCESSOR_ARCHITECTURE
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\citrate-gui-native-windows-$arch.zip"
          Remove-Item $stage -Recurse -Force

      - name: Upload core GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-gui-${{ matrix.os }}
          path: citrate_v0.01.1/dist/*
          if-no-files-found: warn

  # ============================================================================
  # Citrate DefensePrime Shell — first-client (DefensePrime) FedRAMP AppShell binary
  # ============================================================================
  # Gate: DPF-INT-4. Splits the DefensePrime federated surface out of
  # citrate-gui-native into its own binary so the operator GUI and the
  # DefensePrime pilot ship independently from the same workspace.
  # ============================================================================
  build-defense_prime-shell:
    name: Build DefensePrime Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: citrate_v0.01.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: defense_prime-shell-${{ matrix.os }}-${{ hashFiles('citrate_v0.01.1/Cargo.lock') }}
          restore-keys: defense_prime-shell-${{ matrix.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libclang-dev cmake pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install llvm cmake -y

      - name: Build DefensePrime Shell binary
        run: cargo build --locked --release -p citrate-defense_prime-shell

      - name: Package DefensePrime Shell artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          case "$(uname -s)" in
            Linux) OS=linux ;;
            Darwin) OS=macos ;;
            *) OS=$(uname -s | tr '[:upper:]' '[:lower:]') ;;
          esac
          ARCH=$(uname -m)
          STAGE="dist/citrate-defense_prime-shell-${OS}-${ARCH}"
          mkdir -p "${STAGE}"
          cp target/release/citrate-defense_prime-shell "${STAGE}/"
          cp ../LICENSE "${STAGE}/"
          cp gui/citrate_defense_prime_shell/README.md "${STAGE}/"
          cp README.md "${STAGE}/PROJECT_README.md"
          cp ../RELEASE_PACKAGE_MATRIX.md "${STAGE}/"
          cd "${STAGE}"
          if command -v sha256sum &>/dev/null; then
            sha256sum citrate-defense_prime-shell > SHA256SUMS.txt
          else
            shasum -a 256 citrate-defense_prime-shell > SHA256SUMS.txt
          fi
          cd ..
          tar -czf "citrate-defense_prime-shell-${OS}-${ARCH}.tar.gz" "citrate-defense_prime-shell-${OS}-${ARCH}"
          rm -rf "citrate-defense_prime-shell-${OS}-${ARCH}"

          if [[ "$OS" == "linux" ]]; then
            ../scripts/release/build_deb.sh \
              --binary target/release/citrate-defense_prime-shell \
              --package citrate-defense_prime-shell \
              --version "${RELEASE_TAG}" \
              --arch "${ARCH}" \
              --output-dir dist \
              --description "Citrate DefensePrime AppShell — FedRAMP federated surface" \
              --doc ../LICENSE \
              --doc README.md \
              --doc gui/citrate_defense_prime_shell/README.md \
              --doc ../RELEASE_PACKAGE_MATRIX.md \
              --icon gui/citrate_gui_native/assets/images/citrate-icon.png \
              --desktop-name "Citrate DefensePrime AppShell" \
              --desktop-comment "Citrate DefensePrime AppShell — FedRAMP federated surface"
          fi

      - name: Package DefensePrime Shell artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist\citrate-defense_prime-shell-windows-$env:PROCESSOR_ARCHITECTURE"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\citrate-defense_prime-shell.exe $stage\
          Copy-Item ..\LICENSE $stage\
          Copy-Item gui\citrate_defense_prime_shell\README.md $stage\
          Copy-Item README.md "$stage\PROJECT_README.md"
          Copy-Item ..\RELEASE_PACKAGE_MATRIX.md $stage\
          $hash = (Get-FileHash "$stage\citrate-defense_prime-shell.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  citrate-defense_prime-shell.exe" | Set-Content "$stage\SHA256SUMS.txt"
          $arch = $env:PROCESSOR_ARCHITECTURE
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\citrate-defense_prime-shell-windows-$arch.zip"
          Remove-Item $stage -Recurse -Force

      - name: Upload DefensePrime Shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: defense_prime-shell-${{ matrix.os }}
          path: citrate_v0.01.1/dist/*
          if-no-files-found: warn

  # ============================================================================
  # Citrate Learning Center — the school client pilot binary
  # ============================================================================
  # Gate: B-1/B-2/B-3/B-5 landed. This job packages citrate-learning-center
  # alongside the operator-facing citrate-gui-native so the release artifact
  # surface covers both the school client and the operator GUI.
  #
  # Pilot OS: Ubuntu 22.04 LTS (Linux) is the primary supported target for the
  # first 20-100 managed pilot machines. macOS and Windows artifacts are built
  # for parity but the pilot operator is expected to deploy on Linux first.
  # ============================================================================
  build-learning-center:
    name: Build Learning Center (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is pinned (not ubuntu-latest) to match the pilot target
        # described above: Ubuntu 22.04 LTS is the supported OS for the first
        # 20-100 managed pilot machines. macOS and Windows are built for parity.
        os: [ubuntu-22.04, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: citrate_v0.01.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: lc-${{ matrix.os }}-${{ hashFiles('citrate_v0.01.1/Cargo.lock') }}
          restore-keys: lc-${{ matrix.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libclang-dev cmake pkg-config libfontconfig1-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install llvm cmake -y

      - name: Build Learning Center binary
        # WP-I2.4 (audit CI-08): --locked, see Slint GUI job above for rationale.
        run: cargo build --locked --release -p citrate-learning-center

      - name: Run Learning Center unit tests
        # WP-I2.4 (audit CI-08): --locked.
        run: cargo test --locked --release -p citrate-edu-app

      - name: Package Learning Center artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          case "$(uname -s)" in
            Linux) OS=linux ;;
            Darwin) OS=macos ;;
            *) OS=$(uname -s | tr '[:upper:]' '[:lower:]') ;;
          esac
          ARCH=$(uname -m)
          STAGE="dist/citrate-learning-center-${OS}-${ARCH}"
          mkdir -p "${STAGE}"
          cp target/release/citrate-learning-center "${STAGE}/"
          cp ../LICENSE "${STAGE}/"
          cp README.md "${STAGE}/PROJECT_README.md"
          cp ../RELEASE_PACKAGE_MATRIX.md "${STAGE}/"
          if [ -f gui/citrate_learning_center/release/INSTALL.md ]; then
            cp gui/citrate_learning_center/release/INSTALL.md "${STAGE}/"
          fi
          cd "${STAGE}"
          if command -v sha256sum &>/dev/null; then
            sha256sum citrate-learning-center > SHA256SUMS.txt
          else
            shasum -a 256 citrate-learning-center > SHA256SUMS.txt
          fi
          cd ..
          tar -czf "citrate-learning-center-${OS}-${ARCH}.tar.gz" \
            "citrate-learning-center-${OS}-${ARCH}"
          rm -rf "citrate-learning-center-${OS}-${ARCH}"
          echo "Created dist/citrate-learning-center-${OS}-${ARCH}.tar.gz"

          if [[ "$OS" == "linux" ]]; then
            ../scripts/release/build_deb.sh \
              --binary target/release/citrate-learning-center \
              --package citrate-learning-center \
              --version "${RELEASE_TAG}" \
              --arch "${ARCH}" \
              --output-dir dist \
              --description "Citrate Learning Center desktop application" \
              --doc ../LICENSE \
              --doc README.md \
              --doc ../RELEASE_PACKAGE_MATRIX.md \
              --doc gui/citrate_learning_center/release/INSTALL.md \
              --icon gui/citrate_gui_native/assets/images/citrate-icon.png \
              --desktop-name "Citrate Learning Center" \
              --desktop-comment "Citrate Learning Center desktop application"
          fi

      - name: Package Learning Center artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist\citrate-learning-center-windows-$env:PROCESSOR_ARCHITECTURE"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\citrate-learning-center.exe $stage\
          Copy-Item ..\LICENSE $stage\
          Copy-Item README.md "$stage\PROJECT_README.md"
          Copy-Item ..\RELEASE_PACKAGE_MATRIX.md $stage\
          if (Test-Path gui\citrate_learning_center\release\INSTALL.md) {
            Copy-Item gui\citrate_learning_center\release\INSTALL.md $stage\
          }
          $hash = (Get-FileHash "$stage\citrate-learning-center.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  citrate-learning-center.exe" | Set-Content "$stage\SHA256SUMS.txt"
          $arch = $env:PROCESSOR_ARCHITECTURE
          $zip = "dist\citrate-learning-center-windows-$arch.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          Remove-Item $stage -Recurse -Force
          Write-Host "Created $zip"

      # ===========================================================
      # WP-A2.6: native installer matrix legs (MSI / pkg / deb-LC / rpm)
      # ===========================================================
      # The steps above produce raw tar.gz / zip bundles. The steps below
      # produce the IT-friendly installers (MSI for Windows GPO/Intune,
      # .pkg for macOS Jamf/MDM, LC-specific .deb + .rpm for Linux fleet
      # tools). All builders read templates from
      # gui/citrate_learning_center/release/packaging/<os>/ and emit into
      # citrate_v0.01.1/dist/.

      - name: Install Linux LC packaging tools (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y rpm

      - name: Build Linux LC .deb (WP-A2.1)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eux
          scripts/packaging/linux/create-learning-center-deb.sh \
            --version "${RELEASE_TAG#v}" \
            --output dist
          ls dist/

      - name: Validate Linux LC .deb (WP-A2.1)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eux
          DEB="$(ls dist/citrate-learning-center_*.deb | head -n 1)"
          scripts/packaging/lab/validate-learning-center-deb.sh "$DEB"

      - name: Build Linux LC .rpm (WP-A2.1)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eux
          scripts/packaging/linux/create-learning-center-rpm.sh \
            --version "${RELEASE_TAG#v}" \
            --output dist
          ls dist/

      - name: Build macOS LC .pkg (WP-A2.2)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eux
          scripts/packaging/macos/create-learning-center-pkg.sh \
            --version "${RELEASE_TAG#v}" \
            --output dist
          ls dist/

      - name: Install WiX toolset (WP-A2.3)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          # WiX 3.x default install path; fall back to glob if version differs.
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (Test-Path $wixBin) {
            "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Get-ChildItem "C:\Program Files (x86)\WiX*\bin" -ErrorAction SilentlyContinue |
              Select-Object -First 1 |
              ForEach-Object { "$($_.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }

      - name: Build Windows LC MSI (WP-A2.3)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\packaging\windows\build-learning-center-msi.ps1 -Version $env:RELEASE_TAG -OutputDir dist
          Get-ChildItem dist

      - name: Upload Learning Center artifact
        uses: actions/upload-artifact@v4
        with:
          name: learning-center-${{ matrix.os }}
          # Use ** to recurse so dist/learning-center/<arch>/... installer
          # subdirs the builders may create are also captured.
          path: citrate_v0.01.1/dist/**
          if-no-files-found: error  # LC is the pilot binary — fail hard if missing

  # ============================================================================
  # Compute provider bundle — pool-coordinator + training-worker
  # ============================================================================
  # The two daemons partner operators run on their infrastructure to join
  # InferencePools (CM-05 pool-coordinator) or training pools (CM-07
  # citrate-training-worker). Shipped together as a single "compute provider
  # bundle" tarball so a partner pulls one archive and has the binaries for
  # both join paths.
  #
  # Ubuntu 22.04 LTS is the primary target (matches the partner starter kit at
  # docs/partner-starter-kit.md); macOS and Windows artifacts are built for
  # parity but Linux is the documented happy path.
  # ============================================================================
  build-compute-provider-bundles:
    name: Build Compute Provider Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: citrate_v0.01.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cp-${{ matrix.os }}-${{ hashFiles('citrate_v0.01.1/Cargo.lock') }}
          restore-keys: cp-${{ matrix.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libclang-dev cmake pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install llvm cmake -y

      - name: Build compute provider binaries
        # WP-I2.4 (audit CI-08): --locked.
        run: |
          cargo build --locked --release -p citrate-pool-coordinator -p citrate-training-worker

      - name: Package compute provider bundle (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          case "$(uname -s)" in
            Linux) OS=linux ;;
            Darwin) OS=macos ;;
            *) OS=$(uname -s | tr '[:upper:]' '[:lower:]') ;;
          esac
          ARCH=$(uname -m)
          STAGE="dist/citrate-compute-provider-${OS}-${ARCH}"
          mkdir -p "${STAGE}"
          cp target/release/citrate-pool-coordinator "${STAGE}/"
          cp target/release/citrate-training-worker "${STAGE}/"
          cp ../LICENSE "${STAGE}/"
          cp README.md "${STAGE}/PROJECT_README.md"
          cp ../docs/partner-starter-kit.md "${STAGE}/"
          cd "${STAGE}"
          if command -v sha256sum &>/dev/null; then
            sha256sum citrate-pool-coordinator citrate-training-worker > SHA256SUMS.txt
          else
            shasum -a 256 citrate-pool-coordinator citrate-training-worker > SHA256SUMS.txt
          fi
          cd ..
          tar -czf "citrate-compute-provider-${OS}-${ARCH}.tar.gz" \
            "citrate-compute-provider-${OS}-${ARCH}"
          rm -rf "citrate-compute-provider-${OS}-${ARCH}"
          echo "Created dist/citrate-compute-provider-${OS}-${ARCH}.tar.gz"

      - name: Package compute provider bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist\citrate-compute-provider-windows-$env:PROCESSOR_ARCHITECTURE"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\citrate-pool-coordinator.exe $stage\
          Copy-Item target\release\citrate-training-worker.exe $stage\
          Copy-Item ..\LICENSE $stage\
          Copy-Item README.md "$stage\PROJECT_README.md"
          Copy-Item ..\docs\partner-starter-kit.md $stage\
          $hashTargets = @(
            "$stage\citrate-pool-coordinator.exe",
            "$stage\citrate-training-worker.exe"
          )
          $hashLines = foreach ($file in $hashTargets) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $hashLines | Set-Content "$stage\SHA256SUMS.txt"
          $arch = $env:PROCESSOR_ARCHITECTURE
          $zip = "dist\citrate-compute-provider-windows-$arch.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          Remove-Item $stage -Recurse -Force
          Write-Host "Created $zip"

      - name: Upload compute provider bundle
        uses: actions/upload-artifact@v4
        with:
          name: compute-provider-${{ matrix.os }}
          path: citrate_v0.01.1/dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-developer-bundles, build-core-gui, build-defense_prime-shell, build-learning-center, build-compute-provider-bundles]
    environment: github-release
    # All upstream jobs must succeed before we publish a release. The
    # operator GUI (citrate-gui-native) and the DefensePrime AppShell
    # (citrate-defense_prime-shell) both ship in the release surface alongside
    # the node binaries, the Learning Center pilot binary, and the
    # compute-provider bundles, so any GUI failure must block
    # publication rather than silently produce a partial release.
    if: always() && needs.build-developer-bundles.result == 'success' && needs.build-core-gui.result == 'success' && needs.build-defense_prime-shell.result == 'success' && needs.build-learning-center.result == 'success' && needs.build-compute-provider-bundles.result == 'success'
    # RM-B1 / WP-F2.1 (audit REL-01, REL-02): cosign keyless + SBOM
    # require `id-token: write` so the runner can mint a short-lived
    # OIDC token Sigstore validates against this repo + workflow.
    # `attestations: write` lets us publish SLSA-style build provenance
    # alongside the artifacts.
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Generate release navigator and manifest
        run: |
          python3 scripts/release/generate_release_index.py \
            --tag "${RELEASE_TAG}" \
            --asset-root artifacts \
            --output-md "artifacts/release-navigator-${RELEASE_TAG}.md" \
            --output-json "artifacts/release-manifest-${RELEASE_TAG}.json"

      # RM-B1 / WP-F2.1 (audit REL-01): keyless Sigstore signature on
      # every shipped artifact. The cert chain is pinned to the
      # GitHub-Actions-hosted runner OIDC issuer, so consumers can
      # verify a binary was built by this exact workflow on this
      # exact tag with:
      #   cosign verify-blob \
      #     --certificate-identity-regexp \
      #       'https://github.com/<repo>/.github/workflows/release.yml@.+' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --signature <file>.sig --certificate <file>.pem <file>
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Sign all release artifacts with cosign (keyless)
        run: |
          set -euo pipefail
          # Sign every file shipped in the release except the
          # signature/cert outputs we are about to produce.
          while IFS= read -r -d '' f; do
            case "$f" in
              *.sig|*.pem|*.cert) continue ;;
            esac
            echo "Signing $f"
            cosign sign-blob \
              --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done < <(find artifacts -type f -print0)

      # RM-B1 / WP-F2.2 (audit REL-02): CycloneDX SBOM for the Rust
      # workspace, packaged alongside the binaries. anchore/sbom-action
      # does language detection and emits SPDX + CycloneDX in one pass.
      - name: Generate workspace SBOM (CycloneDX + SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: citrate_v0.01.1
          format: cyclonedx-json
          output-file: artifacts/citrate-${{ env.RELEASE_TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate workspace SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: citrate_v0.01.1
          format: spdx-json
          output-file: artifacts/citrate-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign SBOMs with cosign
        run: |
          set -euo pipefail
          for sbom in \
            "artifacts/citrate-${RELEASE_TAG}.cdx.json" \
            "artifacts/citrate-${RELEASE_TAG}.spdx.json"; do
            cosign sign-blob \
              --yes \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.pem" \
              "$sbom"
          done

      # RM-B1 / WP-F2.4 (SLSA-style build provenance): emit attestations
      # for every binary so downstream consumers can verify the build
      # chain via `gh attestation verify`. This uses the GitHub-native
      # attestation API (writes to GHCR + the release) rather than the
      # external SLSA generator workflow, so we don't need to wire up
      # a reusable workflow call.
      - name: Compute artifact hashes for attestation
        id: hashes
        run: |
          set -euo pipefail
          # Collect SHA256 of every shippable file (skipping
          # signatures, certs, manifests, and SBOMs themselves).
          {
            find artifacts -type f \
              ! -name "*.sig" \
              ! -name "*.pem" \
              ! -name "*.cert" \
              ! -name "release-navigator-*.md" \
              ! -name "release-manifest-*.json" \
              ! -name "SHA256SUMS-*.txt" \
              -print0 \
              | xargs -0 sha256sum
          } | base64 -w0 > /tmp/hashes.b64
          echo "hashes=$(cat /tmp/hashes.b64)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/**/citrate-node*
            artifacts/**/citrate-cli*
            artifacts/**/citrate-faucet*
            artifacts/**/citrate-wallet*
            artifacts/**/citrate-gui-native*
            artifacts/**/citrate-defense_prime-shell*
            artifacts/**/citrate-learning-center*
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
            artifacts/**/*.zip

      # SHA256SUMS is now produced AFTER signing + SBOM generation so
      # the manifest covers every byte that ships in the release —
      # including the .sig / .pem / .cdx.json / .spdx.json files.
      # Consumers verify the manifest with `cosign verify-blob` against
      # `SHA256SUMS-<tag>.txt.sig`.
      - name: Generate top-level SHA256 file
        run: |
          find artifacts -type f ! -name "SHA256SUMS-${RELEASE_TAG}.txt" -print0 \
            | sort -z \
            | xargs -0 sha256sum > "artifacts/SHA256SUMS-${RELEASE_TAG}.txt"

      - name: Sign SHA256SUMS
        run: |
          cosign sign-blob \
            --yes \
            --output-signature "artifacts/SHA256SUMS-${RELEASE_TAG}.txt.sig" \
            --output-certificate "artifacts/SHA256SUMS-${RELEASE_TAG}.txt.pem" \
            "artifacts/SHA256SUMS-${RELEASE_TAG}.txt"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: ${{ env.RELEASE_DRAFT }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: false
          body_path: artifacts/release-navigator-${{ env.RELEASE_TAG }}.md
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark older prereleases as superseded
        if: github.event_name == 'workflow_dispatch' && inputs.supersede_old_prereleases == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release/supersede_prereleases.sh \
            "${RELEASE_TAG}" \
            v0.3.0-beta.4 \
            v0.3.0-rc.1
