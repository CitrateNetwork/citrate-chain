name: Release (Node/CLI/Wallet + GUI)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: citrate_v0.01.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install llvm cmake -y

      - name: Build release binaries
        run: |
          cargo build --release -p citrate-node -p citrate-cli -p citrate-wallet -p citrate-faucet

      - name: Package artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          mkdir -p dist
          cp target/release/citrate dist/
          cp target/release/citrate-cli dist/
          cp target/release/wallet dist/citrate-wallet
          cp target/release/citrate-faucet dist/
          cd dist
          if command -v sha256sum &>/dev/null; then
            sha256sum citrate citrate-cli citrate-wallet citrate-faucet > SHA256SUMS.txt
          else
            shasum -a 256 citrate citrate-cli citrate-wallet citrate-faucet > SHA256SUMS.txt
          fi
          tar -czf citrate-${OS}-${ARCH}.tar.gz citrate citrate-cli citrate-wallet citrate-faucet SHA256SUMS.txt
          rm -f citrate citrate-cli citrate-wallet citrate-faucet
          echo "Created dist/citrate-${OS}-${ARCH}.tar.gz"

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\citrate.exe dist\
          Copy-Item target\release\citrate-cli.exe dist\
          Copy-Item target\release\wallet.exe dist\citrate-wallet.exe
          Copy-Item target\release\citrate-faucet.exe dist\
          $arch = $env:PROCESSOR_ARCHITECTURE
          $zip = "dist\citrate-windows-$arch.zip"
          Compress-Archive -Path dist\citrate.exe, dist\citrate-cli.exe, dist\citrate-wallet.exe, dist\citrate-faucet.exe -DestinationPath $zip
          Remove-Item dist\citrate.exe, dist\citrate-cli.exe, dist\citrate-wallet.exe, dist\citrate-faucet.exe
          Write-Host "Created $zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: citrate_v0.01.1/dist/*
          if-no-files-found: warn

  build-tauri:
    name: Build GUI (Tauri) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: citrate_v0.01.1/gui/citrate_gui_v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libclang-dev \
            cmake

      - name: Install deps
        run: npm install

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Collect bundles
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp -r ../../target/release/bundle/* dist/ 2>/dev/null || true

      - name: Collect bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item ..\..\target\release\bundle\* dist\ -Recurse -ErrorAction SilentlyContinue

      - name: Upload GUI bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: citrate_v0.01.1/gui/citrate_gui_v2/dist/**
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-tauri]
    if: always() && needs.build-binaries.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
