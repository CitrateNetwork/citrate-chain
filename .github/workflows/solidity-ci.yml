name: Solidity CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - '.github/workflows/solidity-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - '.github/workflows/solidity-ci.yml'

# RM-B1 / WP-F1.1 (audit CI-01): minimum permissions at workflow level.
permissions:
  contents: read

concurrency:
  group: solidity-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  forge-tests:
    # CI-OOM (2026-07): this job was failing with exit 143 (SIGTERM) —
    # the Linux OOM-killer terminating the solc subprocess mid-compile,
    # NOT a test or compile *error*. Root cause: the contract set is
    # large (~224 .sol files / ~74k LOC) and `foundry.toml` sets
    # `via_ir = true`, which is MANDATORY here (a plain
    # `FOUNDRY_VIA_IR=false forge build` fails with "Stack too deep" in
    # LValue.cpp — several contracts exceed the 16-slot EVM stack without
    # the Yul pipeline). via-IR holds the whole compilation unit in
    # memory, and forge compiles several solc jobs concurrently (one per
    # logical core), so peak RSS ≈ N × (per-unit via-IR footprint). On a
    # GitHub-hosted runner that multiplied past the memory ceiling.
    #
    # MITIGATION (coverage-neutral — does NOT change bytecode, optimizer
    # settings, or which tests run; it only bounds scheduling + adds swap):
    #   * `FOUNDRY_THREADS: 1` serializes solc jobs so peak memory is a
    #     SINGLE via-IR unit rather than Nx (the earlier `2` cap still
    #     OOM'd — two concurrent via-IR units exceeded the ~7 GB hosted-
    #     runner ceiling).
    #   * A large swapfile gives the single-unit via-IR compile a disk-
    #     backed safety net so a transient peak spills to swap instead of
    #     being killed (exit 143). Trades wall-clock for completing.
    #   * `forge build` runs as its own step first, warming the compile
    #     cache; the subsequent `forge test` reuses artifacts and only
    #     pays the (memory-light) test-runtime cost.
    #
    # DEVOPS ESCALATION (to drop the swap+serialize slowdown): move this
    # job to a larger runner with more RAM, e.g.:
    #     runs-on: ubuntu-latest-8-cores   # (or a GitHub Larger Runner)
    # or a self-hosted runner with >=16 GB free, then raise FOUNDRY_THREADS
    # and remove the swap step below.
    runs-on: ubuntu-latest
    env:
      # Serialize solc via-IR compilations so peak memory is a single unit.
      # Raise on a bigger runner (see escalation note above).
      FOUNDRY_THREADS: 1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Give the memory-heavy via-IR compile a disk-backed safety net so a
      # transient peak spills to swap instead of being OOM-killed (exit 143).
      # Placed on /mnt (the large ephemeral disk on hosted runners).
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/ci-swapfile
          sudo fallocate -l 12G /mnt/ci-swapfile || \
            sudo dd if=/dev/zero of=/mnt/ci-swapfile bs=1M count=12288
          sudo chmod 600 /mnt/ci-swapfile
          sudo mkswap /mnt/ci-swapfile
          sudo swapon /mnt/ci-swapfile
          echo "--- memory after adding swap ---"
          free -h
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install solc 0.8.26 (required by some contracts)
        run: |
          curl -L -o /usr/local/bin/solc \
            https://github.com/ethereum/solidity/releases/download/v0.8.26/solc-static-linux
          chmod +x /usr/local/bin/solc
          solc --version
      # Compile first (serialized via FOUNDRY_THREADS=1 + swap) so the cache
      # is warm; keeps the heavy via-IR work in one observable step.
      - name: Build contracts (bounded concurrency)
        working-directory: contracts
        run: |
          forge --version
          forge build --use 0.8.26 --threads 1
      - name: Run Forge tests
        working-directory: contracts
        run: |
          forge test -vvv --use 0.8.26 --threads 1

  slither:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true  # Slither findings surface as warnings but don't block
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry (slither needs forge for compilation)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Python and Slither
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install slither-analyzer solc-select
          solc-select install 0.8.26 && solc-select use 0.8.26
      - name: Run Slither
        working-directory: contracts
        run: |
          slither . --solc-remaps @openzeppelin/=lib/openzeppelin-contracts/
