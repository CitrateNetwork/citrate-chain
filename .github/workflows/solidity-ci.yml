name: Solidity CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'citrate_v0.01.1/contracts/**'
      - 'citrate_v0.01.1/foundry.toml'
  pull_request:
    paths:
      - 'citrate_v0.01.1/contracts/**'
      - 'citrate_v0.01.1/foundry.toml'

concurrency:
  group: solidity-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  forge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run Forge tests
        working-directory: citrate_v0.01.1
        run: |
          forge --version
          forge test -vvv

  slither:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and Slither
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          pip3 install slither-analyzer solc-select
          solc-select install 0.8.26 && solc-select use 0.8.26
      - name: Run Slither
        working-directory: citrate_v0.01.1
        run: |
          slither . --solc-remaps @openzeppelin/=lib/openzeppelin-contracts/
