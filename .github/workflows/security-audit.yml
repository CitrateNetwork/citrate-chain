name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'citrate_v0.01.1/**/Cargo.toml'
      - 'citrate_v0.01.1/**/Cargo.lock'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'citrate_v0.01.1/**/Cargo.toml'
      - 'citrate_v0.01.1/**/Cargo.lock'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  cargo-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citrate_v0.01.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo-audit
        run: cargo audit

  clippy-deny:
    name: Clippy (deny warnings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citrate_v0.01.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy with denied warnings
        run: cargo clippy --workspace --exclude lattice-core --all-targets -- -D warnings -A dead_code -A unused_imports -A unused_variables

  cargo-deny:
    name: License & Advisory Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citrate_v0.01.1
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check advisories
        run: cargo deny check advisories 2>&1 || true
      - name: Check licenses
        run: cargo deny check licenses 2>&1 || true
