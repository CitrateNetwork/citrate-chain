name: Rust CI

on:
  workflow_dispatch:
  push:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - '**/build.rs'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - '**/build.rs'
      - '.github/workflows/rust-ci.yml'

# RM-B1 / WP-F1.1 (audit CI-01): workflow-level minimum permissions.
permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  core-workspace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config
      - name: Show toolchain
        run: rustc -Vv && cargo -V
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-ci-${{ runner.os }}-
      # RM-B1 / WP-F1.4 (audit CI-08, CI-10, REL-05): every cargo
      # invocation runs `--locked` so a transient registry hiccup
      # (or a malicious lockfile-bumping action) can't silently
      # introduce a new dependency version.
      - name: Build tests (no run)
        run: cargo test --workspace --no-run --locked
      - name: Run core workspace tests
        run: cargo test --workspace --quiet --locked

  verifier-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config
      - name: Show toolchain
        run: rustc -Vv && cargo -V
      - name: Build citrate-api with verifier feature
        run: cargo build --locked -p citrate-api --features verifier-ethers-solc
      - name: Run citrate-api tests with verifier feature
        run: cargo test --locked -p citrate-api --features verifier-ethers-solc -- --nocapture
