name: Rust CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'citrate_v0.01.1/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'citrate_v0.01.1/**'
      - '.github/workflows/rust-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citrate_v0.01.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config
      - name: Show toolchain
        run: rustc -Vv && cargo -V
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            citrate_v0.01.1/target
          key: rust-ci-${{ runner.os }}-${{ hashFiles('citrate_v0.01.1/Cargo.lock') }}
          restore-keys: rust-ci-${{ runner.os }}-
      - name: Build tests (no run) — exclude GUI crate
        run: cargo test --workspace --exclude citrate-core --no-run
      - name: Run tests — exclude GUI crate
        run: cargo test --workspace --exclude citrate-core --quiet

  verifier-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citrate_v0.01.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config
      - name: Show toolchain
        run: rustc -Vv && cargo -V
      - name: Build citrate-api with verifier feature
        run: cargo build -p citrate-api --features verifier-ethers-solc
      - name: Run citrate-api tests with verifier feature
        run: cargo test -p citrate-api --features verifier-ethers-solc -- --nocapture
