name: Rust CI

on:
  workflow_dispatch:
  push:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - '**/build.rs'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - '**/build.rs'
      - '.github/workflows/rust-ci.yml'

# RM-B1 / WP-F1.1 (audit CI-01): workflow-level minimum permissions.
permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  core-workspace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config
      - name: Show toolchain
        run: rustc -Vv && cargo -V
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-ci-${{ runner.os }}-
      # RM-B1 / WP-F1.4 (audit CI-08, CI-10, REL-05): every cargo
      # invocation runs `--locked` so a transient registry hiccup
      # (or a malicious lockfile-bumping action) can't silently
      # introduce a new dependency version.
      - name: Build tests (no run)
        run: cargo test --workspace --no-run --locked
      - name: Run core workspace tests
        run: cargo test --workspace --quiet --locked

  verifier-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config
      # CI-fix (2026-06-05): install a real `solc` binary so the verifier
      # tests EXERCISE compile_runtime_bytecode instead of skipping via
      # the solc_is_usable() guard in server.rs. We pull the canonical
      # linux-amd64 static build of solc 0.8.36 (the version the tests
      # pin) directly from the ethereum/solidity GitHub release and put
      # it on PATH as `solc`. The SHA-256 is pinned so a tampered mirror
      # / replaced asset fails the install step.
      #
      # Why not solc-select / apt: the ubuntu-latest image's solc-select
      # wrapper was the source of the original "Exec format error" — its
      # versioned artifact got into a bad state. Pulling the static
      # binary straight from the release skips that whole layer.
      - name: Install solc 0.8.36
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/solc \
            https://github.com/ethereum/solidity/releases/download/v0.8.36/solc-static-linux
          echo "c8d35afdddc3cd2743ee88b8f25e0fecd16e2bdd5f2120f37e52cd9cc45ae0e6  /tmp/solc" \
            | sha256sum -c -
          sudo install -m 0755 /tmp/solc /usr/local/bin/solc
          solc --version
      - name: Show toolchain
        run: rustc -Vv && cargo -V
      # REM-13b (2026-05-20): removed `--features verifier-ethers-solc`.
      # The feature flag has been deleted from core/api/Cargo.toml
      # because the ethers-solc + semver deps were never imported in
      # source. Both compile_runtime_bytecode variants delegated to
      # the same external `solc` Command path. The previously-gated
      # tests (test_compile_single_contract_opt_and_unopt +
      # test_compile_multi_contract_select_by_name) are now part of
      # the default test suite and run unconditionally below (they
      # skip themselves via solc_is_usable() if solc is not present
      # on PATH or its wrapper can't produce a real version line —
      # see the helper in server.rs).
      - name: Build citrate-api (default features)
        run: cargo build --locked -p citrate-api
      - name: Run citrate-api tests (default features)
        run: cargo test --locked -p citrate-api -- --nocapture
