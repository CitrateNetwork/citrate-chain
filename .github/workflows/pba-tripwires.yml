name: PBA tripwires

# PBA-R2 (pre-bounty audit 2026-09-24, lane CHAIN-EXEC): source-level fences
# for finding classes that live partly outside Rust (deploy scripts, unit
# files, build commands), so rust-ci.yml's path filter would not run them.
# grep-only: seconds, no toolchain. No path filter on purpose.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pba-tripwires-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tripwires:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Prove the scanner still detects each class, then scan the tree.
      - name: Tripwire self-test
        run: scripts/ci/check_pba_exec_tripwires.sh --self-test
      - name: CHAIN-EXEC tripwires (signature setting, node feature set, mempool expiry, metrics bind)
        run: scripts/ci/check_pba_exec_tripwires.sh
      # The testnet deploy script installs only pinned, verified releases. The test greps
      # all of scripts/ (test fixtures included), so it fails on any new unpinned-download
      # string anywhere under scripts/. Runs unprivileged with a sandboxed HOME.
      - name: Deploy-testnet supply-chain test
        run: bash scripts/tests/test_deploy_testnet_supply_chain.sh
      - name: SALT supply tripwire self-test
        run: scripts/ci/salt_supply_tripwire.sh --self-test
      - name: SALT supply basis (contracts constant = core/economics; no literal governor supply)
        run: scripts/ci/salt_supply_tripwire.sh
      - name: Privileged-slot tripwire self-test
        run: scripts/ci/privileged_slots_tripwire.sh --self-test
      - name: Privileged slots of DeployAll contracts are swept or exempt with a reason
        run: scripts/ci/privileged_slots_tripwire.sh
      - name: Mempool lock-order tripwire (self-test, then scan)
        run: |
          scripts/ci/mempool_lock_order_tripwire.sh --self-test
          scripts/ci/mempool_lock_order_tripwire.sh
