name: Perf Smoke (manual)

on:
  workflow_dispatch: {}

# RM-B1 / WP-F1.1 (audit CI-01): minimum permissions at workflow level.
permissions:
  contents: read

jobs:
  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Build node image
        run: docker build -t citrate:latest -f Dockerfile 

      - name: Start devnet and monitoring
        run: |
          docker compose -f docker-compose.yml up -d --profile devnet --profile monitoring citrate-node-devnet prometheus

      - name: Wait for node and Prometheus
        run: |
          for i in {1..60}; do curl -fsS http://localhost:8545 && break || sleep 5; done
          for i in {1..60}; do curl -fsS http://localhost:9090/-/ready && break || sleep 5; done

      - name: Collect smoke metrics
        run: |
          mkdir -p perf
          curl -fsS -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
            http://localhost:8545 > perf/rpc_chain_id.json
          curl -fsS 'http://localhost:9090/api/v1/query?query=up' -o perf/prometheus_up.json
          echo "Timestamp: $(date -u +%FT%TZ)" > perf/meta.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-metrics
          path: perf/

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v || true
