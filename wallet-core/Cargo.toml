[package]
name = "citrate-wallet-core"
version = "0.4.0"
edition = "2021"
description = "Universal wallet core — key management, transactions, credentials, DIDs"
license = "MIT OR Apache-2.0"

[dependencies]
# Key management (WASM-compatible — pure Rust)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa", "ecdsa-core"] }
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
rand = { workspace = true }
hex = "0.4"
rlp = "0.5"
bip39 = { version = "1.2", features = ["rand", "std"] }
# BIP32 → BIP44 HD derivation (WAL / feat/wal-bip44-secp256k1-hd).
# `secp256k1` here is bip32's PURE-RUST k256-backed curve feature
# (`secp256k1 = ["k256"]`), NOT the C-FFI backend — that is the separate
# `secp256k1-ffi` feature, which we do NOT enable. Verified via
# `cargo tree`: no `secp256k1-sys`/native crate enters the build graph,
# so HD derivation stays WASM-compatible (pure Rust, matching the crate's
# WASM posture). Pulls k256 0.13.4, matching our `k256 = "0.13"`.
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "alloc"] }

# Encryption (WASM-compatible — pure Rust)
# WP-A3.3: AEAD calls route through the citrate-security wrapper which
# enforces AAD-bind via Payload. Direct aes-gcm use in this crate is
# allowed only inside the keystore migration path; new code must call
# `Aead::seal/open`.
aes-gcm = "0.10"
citrate-security = { path = "../core/security" }
argon2 = "0.5"
# Audit finding WAL-04: zeroize secret material on drop.
# Audit finding CX-02: constant-time byte comparison for MAC/tag values.
zeroize = { version = "1.7", features = ["zeroize_derive"] }
subtle = "2.5"

# Serialization (WASM-compatible)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling (WASM-compatible)
thiserror = "1"
anyhow = "1"

# Utilities (WASM-compatible)
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

# Native-only dependencies (not compiled for WASM)
tokio = { version = "1", features = ["full"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
bincode = { version = "1", optional = true }
dirs = { version = "5", optional = true }
primitive-types = { version = "0.12", optional = true }

# Citrate chain types (native-only)
citrate-consensus = { path = "../core/consensus", optional = true }
citrate-execution = { path = "../core/execution", optional = true }

[features]
default = ["native"]
native = ["tokio", "reqwest", "bincode", "dirs", "primitive-types", "citrate-consensus", "citrate-execution"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
proptest = "1"
# WP-A1.2: Argon2 calibration bench. Pinned to the workspace value.
criterion = { workspace = true }

[[bench]]
name = "argon2_calibration"
harness = false
