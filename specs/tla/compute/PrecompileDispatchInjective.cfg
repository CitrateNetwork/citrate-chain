SPECIFICATION Spec

\* Reduced model: 4 addresses × 4 ops. The injectivity property
\* generalizes by induction on cardinality — proving it at this
\* small scale exhaustively is sufficient. Larger configurations
\* blow up state space (4 addresses × 4 ops × stuttering = ~4^4
\* = 256 base states; full Citrate config of 16×12 explodes to
\* >50M states). The structural property is the same.
CONSTANTS
    Addresses = {0, 1, 2, 3}
    Ops = {"Matmul", "Dot", "Softmax", "Relu"}

INVARIANT TypeOK
INVARIANT DispatchInjective
INVARIANT AllocationImmutable
INVARIANT HistoryNeverDropped
INVARIANT SafetyInvariant

CHECK_DEADLOCK FALSE
