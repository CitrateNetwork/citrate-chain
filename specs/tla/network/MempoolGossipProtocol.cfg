SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Txs = {tx1, tx2, tx3}
    Senders = {alice, bob}
    TxSender = (tx1 :> alice @@ tx2 :> alice @@ tx3 :> bob)
    TxNonce = (tx1 :> 0 @@ tx2 :> 1 @@ tx3 :> 0)

INVARIANT TypeOK
INVARIANT NoDuplicateTx
INVARIANT NonceOrdering
INVARIANT NoDoubleSend
