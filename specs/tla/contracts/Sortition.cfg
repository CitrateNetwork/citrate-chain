SPECIFICATION Spec

\* The clock is bounded (MaxBlock), so the last state of every behaviour has
\* nothing enabled. That is the model ending, not the contract wedging.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT SO1_SeedExistsOnlyWhenFinal
INVARIANT SO2_EveryCommitmentIsInTheSeed
INVARIANT SO3_FinalizedInsideItsWindow
INVARIANT SO3_NoCommitteeFromAStalledDraw

PROPERTY StatesAreTerminal
PROPERTY SeedIsImmutable
PROPERTY CommitmentsPrecedeTheTarget

CONSTANTS
  Draws = {d1}
  Actors = {a1, a2}
  MaxBlock = 12
  MinDelta = 2
  FinalityDelay = 2
  Horizon = 4
