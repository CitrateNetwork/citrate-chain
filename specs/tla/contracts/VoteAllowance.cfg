SPECIFICATION Spec

\* The clock is bounded (MaxTime), so the final state of every behaviour has
\* nothing enabled: no grant can name a future expiry once time has run out.
\* That is the model ending, not the contract wedging, so deadlock checking is
\* off deliberately rather than by omission.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT VA1_SpentWithinCap
INVARIANT VA2_DeadAllowancesNeverSpend
INVARIANT VA3_EveryVoteTracesToOnePrincipal
INVARIANT VA4_NoSubDelegation
INVARIANT OneCastPerProposal
INVARIANT SpendMatchesVotes
INVARIANT NoVotesWithoutAnAllowance

CONSTANTS
  Principals = {p1, p2}
  Agents = {g1}
  Ids = {i1, i2}
  Classes = {c1, c2}
  Proposals = {r1, r2}
  MaxWeight = 3
  MaxTime = 3
