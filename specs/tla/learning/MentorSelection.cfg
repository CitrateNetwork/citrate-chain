SPECIFICATION Spec

\* The spec checks safety invariants only; there is no liveness
\* property here. Disable deadlock detection so initial states
\* with no qualified mentor (e.g. all accuracies = 0) are not
\* reported as failures. WP-4.1 audit fix.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT MentorHigherAccuracy
INVARIANT MentorCapacity
INVARIANT NoSelfMentor
INVARIANT MenteeHasAtMostOneMentor
INVARIANT DomainOverlapPreferred
INVARIANT MentorLoadConsistent

CONSTANTS
  Participants = {p1, p2, p3}
  Domains = {d1, d2}
  MinAccuracyGap = 2
  MaxMentees = 2
  MaxAccuracy = 10
