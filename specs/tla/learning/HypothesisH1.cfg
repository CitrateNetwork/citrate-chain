SPECIFICATION Spec

\* Pure-safety spec (protocol-level invariants for H1's experimental
\* design). No liveness; disable deadlock detection so initial
\* states with no submissions don't trip TLC.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT OnlyAdversaryRegionMislabels
INVARIANT BelnapMatchesFlatMeanWithoutMislabel
INVARIANT AggregationTotal
INVARIANT BelnapBoundedDeviation

CONSTANTS
  Regions = {r1, r2, r3, r4}
  MislabelRegion = r4
  Dimensions = {d1, d2}
  MaxConfidence = 4
  MaxSubmissions = 4
