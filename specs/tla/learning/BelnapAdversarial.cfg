SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT HonestSafety
INVARIANT NoSpontaneousFalseAtReducedLevel
INVARIANT BothRequiresTwoSides
INVARIANT NeitherImpliesUnderconfidence
INVARIANT AdversaryCannotFlipUnderHDA
INVARIANT WeightZeroIgnored
INVARIANT HonestHighConfImpliesAgreeSetNonEmpty
INVARIANT AllByzantineProducesAcceptableState

\* MaxByzantine bumped 3 → 4 at WP-1.8 to include the all-Byzantine
\* worst-case initial state, exercising INV-9.
CONSTANTS
  Validators = {V1, V2, V3, V4}
  MaxByzantine = 4
  Signs = {"pos", "neg"}
  Confs = {"high", "low"}
  Weights = {"full", "half", "zero"}
  GroundTruthSign = "pos"

CONSTRAINT
  TRUE
