SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT ByzantineCountWithinThreshold
INVARIANT HonestQuorumPossible
INVARIANT NoByzantineFinalization
INVARIANT FinalizationMonotonic

\* 7 validators, 2 Byzantine: 2 < 7/3 = 2.33, so 3*K=6 < N=7. OK.
\* QuorumThreshold = 2*7/3 + 1 = 4 + 1 = 5. Honest count = 5. Quorum
\* possible iff all 5 honest validators commit.
CONSTANTS
  Validators = {"v1", "v2", "v3", "v4", "v5", "v6", "v7"}
  Byzantine = {"v6", "v7"}
  MaxCheckpoints = 2
