SPECIFICATION Spec

\* Pure-safety spec — no liveness; disable deadlock detection so
\* initial states with no qualified mentor (e.g. all accuracies < TrustFloor)
\* don't trip TLC. Same fix pattern as MentorSelection.cfg.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT TrustFloorAtPairing
INVARIANT CapacityHoldsUnderAdversary
INVARIANT PairingAccuracyGapPreservedAtCommit
INVARIANT NoSybilCaptureAtTrustFloor
INVARIANT MentorLoadConsistent
INVARIANT NoSelfMentor

CONSTANTS
  Participants = {p1, p2, p3}
  Adversaries = {p3}
  Domains = {d1, d2}
  MinAccuracyGap = 2
  MaxMentees = 2
  MaxAccuracy = 6
  TrustFloor = 3
