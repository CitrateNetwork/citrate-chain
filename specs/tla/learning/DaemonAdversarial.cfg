SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ChainFinalizedAtMostOnce
INVARIANT DaemonHWMBoundedByChain
INVARIANT NoCommitWithoutChainCommit
INVARIANT ChainAdvanceRespectsHonest

\* Two daemons against two cycles over two blocks. The multi-daemon
\* model + TLC's exhaustive interleaving exploration covers the
\* race-condition cases — finalize racing, restart races,
\* embedding observation order — without needing separate adversary
\* actions. Bounds are tight to keep the state space tractable.
CONSTANTS
  Cycles = {1, 2}
  MaxBlocks = 2
  DaemonIds = {D1, D2}

CONSTRAINT
  TRUE
