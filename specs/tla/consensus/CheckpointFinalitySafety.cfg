\* Gating model: 4 voters (3 honest nodes + 1 Byzantine), quorum 3, one
\* checkpoint height (its fork point is genesis, so a raised floor pins it), two
\* sibling candidates, durable signed-vote record ON. Every invariant and
\* property must hold. Bounded for CI (~10^4 distinct states, seconds);
\* CheckpointFinalitySafety_deep.cfg covers two heights (run on demand).
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    Byz = {z1}
    Heights = {1}
    Hashes = {a, b}
    None = None
    DurableRecord = TRUE
    CommitteeSize = 4
    SyncFloor = TRUE
    BootRegLimit = 1

SYMMETRY NodeSymmetry

INVARIANT TypeOK
INVARIANT NoConflictingFinality
INVARIANT HonestNoEquivocation
INVARIANT FloorBlockIsFinalized
INVARIANT FinalizedHasQuorum

PROPERTY HaltedSignsNothing
PROPERTY FloorMonotone
