\* EIP-158 fix model: an empty account is NOT folded into the state root, so
\* every role folds only the committed NON-EMPTY set regardless of which
\* empty accounts its node-local read-through / restart history made resident.
\* Expectation: TLC finds NO error — Purity, RootAgreement and injectivity all
\* hold; producer / receiver / coldsync / restart / reorg converge.
SPECIFICATION Spec

CONSTANTS
    Roles = {producer, receiver, coldsync, restart, reorg}
    Accounts = {1, 2, 3}
    EmptyAccounts = {3}
    Base = 10
    MaxBlocks = 3
    FoldEmpties = FALSE

INVARIANT TypeOK
INVARIANT Purity
INVARIANT RootAgreement
INVARIANT StateRootInjective
