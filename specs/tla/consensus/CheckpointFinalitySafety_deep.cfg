\* Deep model (on demand, not in CI): exhaustive run 2026-10-19 — 92,123,688 distinct
\* states, depth 38, no violation, 46 min on 12 workers / 16 GB heap. As
\* CheckpointFinalitySafety.cfg with two checkpoint heights, so certificates,
\* floors and reorgs at different heights interleave (LatestFin ordering).
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    Byz = {z1}
    Heights = {1, 2}
    Hashes = {a, b}
    None = None
    DurableRecord = TRUE
    CommitteeSize = 4
    SyncFloor = TRUE

SYMMETRY NodeSymmetry

INVARIANT TypeOK
INVARIANT NoConflictingFinality
INVARIANT HonestNoEquivocation
INVARIANT FloorBlockIsFinalized
INVARIANT FinalizedHasQuorum

PROPERTY HaltedSignsNothing
PROPERTY FloorMonotone
