\* Mutation model (review of #332 @ 354908b): Stage 1b certificate sync
\* installs a peer's certificate WITHOUT the FinalizationGuard (CertSync =
\* "unguarded"): the certificate is visible before the floor rises, which
\* follows only at the next VerifyFloor. Expectation: TLC PRODUCES a
\* counterexample violating FinalizedNeverReverted: SyncCert -> Reorg reverting
\* the synced, finalized block. The guarded install (the code) is checked by
\* CheckpointFinalitySafety_strict.cfg and CheckpointFinalitySafety.cfg.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    Byz = {z1}
    Heights = {1}
    Hashes = {a, b}
    None = None
    DurableRecord = TRUE
    CommitteeSize = 4
    SyncFloor = TRUE
    BootRegLimit = 1
    CertSync = "unguarded"

SYMMETRY NodeSymmetry

INVARIANT TypeOK

PROPERTY FinalizedNeverReverted
