\* HUP-S7.2: the shipped rule (a release network refuses per-node fork heights
\* when the release pins none). Two scenarios are checked by this spec's sibling
\* configs: NoPin here (the 40204 default) and a pinned height
\* (AgentPrecompileFork_pinned.cfg). Expectation: no error.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxHeight = 6
    PbaHeight = 2
    NoPin = NoPin
    None = None
    Off = Off
    Refuse = Refuse
    Pin = NoPin
    LocalChoices = {0, 1, 3, 4}
    RefuseUnpinned = TRUE

INVARIANT TypeOK
INVARIANT AgreeOnSet
INVARIANT LegacyBelow
INVARIANT GenesisUntouched
INVARIANT ForkAddrsLive
INVARIANT Disjoint
