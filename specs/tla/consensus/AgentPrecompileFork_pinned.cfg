\* HUP-S7.2: a release that pins the fork at height 4 (the owner's hard-fork
\* release). Nodes whose local value disagrees refuse to start; every started
\* node agrees. Expectation: no error.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxHeight = 6
    PbaHeight = 2
    NoPin = NoPin
    None = None
    Off = Off
    Refuse = Refuse
    Pin = 4
    LocalChoices = {0, 1, 3, 4}
    RefuseUnpinned = TRUE

INVARIANT TypeOK
INVARIANT AgreeOnSet
INVARIANT LegacyBelow
INVARIANT GenesisUntouched
INVARIANT ForkAddrsLive
INVARIANT Disjoint
