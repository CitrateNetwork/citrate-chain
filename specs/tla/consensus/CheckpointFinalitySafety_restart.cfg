\* S2 across restarts with several stored certificates (review of #335 @
\* 5236d2b). One node and three Byzantine voters (they hold a quorum, so any
\* candidate can finalize at any time), two checkpoint heights: certificates,
\* mismatch stops, reorgs and restarts interleave at both heights. The boot
\* check consults EVERY stored certificate (BootRegLimit = 2 = all heights),
\* as FloorVerifier::restore_certified_floor does. Expectation: no violation.
\* The truncated variant is CheckpointFinalitySafety_bootlimit.cfg (must fail).
\* FinalizedStaysCanonical is not checked here: with a Byzantine quorum the two
\* heights can be finalized for blocks no single chain holds (a@1, b@2 with b@1
\* canonical), and the model's VerifyFloor clears a stop on the latest
\* certificate alone; that is outside the S1 assumption this config drops.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1}
    Byz = {z1, z2, z3}
    Heights = {1, 2}
    Hashes = {a, b}
    None = None
    DurableRecord = TRUE
    CommitteeSize = 4
    SyncFloor = TRUE
    BootRegLimit = 2
    CertSync = "off"

INVARIANT TypeOK
INVARIANT FloorBlockIsFinalized

PROPERTY FinalizedNeverReverted
PROPERTY FloorMonotone
