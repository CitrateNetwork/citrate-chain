\* ============================================================================
\* ExecutorMVCC Medium parameter TLC configuration — WP-A.1.6
\*
\* Sprint: P950-A / Phase A.1 / WP-A.1.6
\*
\* Larger parameter set for breadth-coverage of interleavings. Expected
\* state count: roughly 10-100x the Small config (which was 1.15M).
\*
\* Parameter set:
\*   - 3 Accounts (same as Small)
\*   - 3 Workers  (+1 vs Small — adds three-way commit races)
\*   - 3 Txs      (same as Small)
\*   - MaxRetries = 3 (same as Small)
\*
\* Note: the 4-accts × 3-workers × 4-txs "Medium" parameter plan from
\* SPRINT.md was attempted and found to explore a state space too large
\* to complete in CI-reasonable time. The present config tests the
\* three-worker dimension while keeping other dimensions at Small-size;
\* a fuller Medium run is deferred to the deep verification track
\* (opt-in via operator, not CI).
\*
\* Safety only; liveness checking is covered by ExecutorMVCC_liveness.cfg
\* at the 2-worker size.
\* ============================================================================

SPECIFICATION Spec

INVARIANT TypeInv
INVARIANT ReadVersionNotAhead
INVARIANT AccountVersionBound
INVARIANT CommitOrderUnique
INVARIANT CommitOrderConsistent
INVARIANT CommitOrderComplete
INVARIANT IdleWorkerHasNoTx
INVARIANT BoundedRetries
INVARIANT UniqueTxClaim
INVARIANT GlobalVersionTracksCommits
INVARIANT CommittedTxInOrder
INVARIANT AccountVersionBoundedByCommits
INVARIANT IdleSetsEmpty
INVARIANT ReadyWorkerCommitOrRetry

PROPERTY ReadVersionMonotonic

CONSTANTS
  Accounts = {a1, a2, a3}
  Workers = {w1, w2, w3}
  Txs = {t1, t2, t3}
  NoTx = no_tx
  MaxRetries = 3
