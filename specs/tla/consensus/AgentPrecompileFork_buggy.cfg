\* Mutation: a release-network node may schedule the fork from its own env or
\* config while the release pins nothing (RefuseUnpinned = FALSE).
\* Expectation: TLC PRODUCES a counterexample violating AgreeOnSet (two honest
\* nodes register different precompile sets at the same height: a fork).
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxHeight = 6
    PbaHeight = 2
    NoPin = NoPin
    None = None
    Off = Off
    Refuse = Refuse
    Pin = NoPin
    LocalChoices = {0, 1, 3, 4}
    RefuseUnpinned = FALSE

INVARIANT TypeOK
INVARIANT AgreeOnSet
INVARIANT LegacyBelow
INVARIANT GenesisUntouched
INVARIANT ForkAddrsLive
INVARIANT Disjoint
