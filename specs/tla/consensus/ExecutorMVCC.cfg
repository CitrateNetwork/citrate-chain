\* ============================================================================
\* ExecutorMVCC TLC configuration — Small parameter set (WP-A.1.1 skeleton)
\*
\* Sprint: P950-A / Phase A.1 / WP-A.1.1
\*
\* In WP-A.1.1 the only reachable state is Init, so all six invariants
\* should hold trivially. This config validates the skeleton + TypeInv
\* before WP-A.1.2 adds real transitions.
\*
\* Parameters for WP-A.1.2 onward will expand to:
\*   Medium:  Accounts = 4, Workers = 3, Txs = 4, MaxRetries = 3
\*   Large:   Accounts = 5, Workers = 4, Txs = 6, MaxRetries = 4
\* See SPRINT.md WP-A.1.6 for the full parameter matrix.
\* ============================================================================

SPECIFICATION Spec

INVARIANT TypeInv
INVARIANT ReadVersionNotAhead
INVARIANT AccountVersionBound
INVARIANT CommitOrderUnique
INVARIANT CommitOrderConsistent
INVARIANT CommitOrderComplete
INVARIANT IdleWorkerHasNoTx
INVARIANT BoundedRetries
INVARIANT UniqueTxClaim
INVARIANT GlobalVersionTracksCommits
INVARIANT CommittedTxInOrder
INVARIANT AccountVersionBoundedByCommits
INVARIANT IdleSetsEmpty
INVARIANT ReadyWorkerCommitOrRetry

PROPERTY ReadVersionMonotonic

CONSTANTS
  Accounts = {a1, a2, a3}
  Workers = {w1, w2}
  Txs = {t1, t2, t3}
  NoTx = no_tx
  MaxRetries = 3
