\* ============================================================================
\* ExecutorMVCC liveness TLC configuration — WP-A.1.4
\*
\* Sprint: P950-A / Phase A.1 / WP-A.1.4
\*
\* Uses SpecLive (safety + fairness) to verify the Progress temporal
\* property: every pending tx eventually reaches TxCommitted.
\*
\* TLC liveness checking is substantially slower than safety. This config
\* uses a smaller parameter set than ExecutorMVCC.cfg (safety) to keep
\* the run tractable. The safety invariants are still checked on this
\* smaller state space as a cross-check.
\*
\* Parameter set:
\*   - 2 Accounts (vs 3 in safety) — reduces read/write-set power-set size
\*   - 2 Workers — same as safety
\*   - 2 Txs (vs 3) — reduces commit-order factorial
\*   - MaxRetries = 2 (vs 3) — smaller retry counter domain
\*   - MaxVersion unchanged (20)
\* ============================================================================

SPECIFICATION SpecLive

INVARIANT TypeInv
INVARIANT ReadVersionNotAhead
INVARIANT AccountVersionBound
INVARIANT CommitOrderUnique
INVARIANT CommitOrderConsistent
INVARIANT CommitOrderComplete
INVARIANT IdleWorkerHasNoTx
INVARIANT BoundedRetries
INVARIANT UniqueTxClaim
INVARIANT GlobalVersionTracksCommits
INVARIANT CommittedTxInOrder
INVARIANT AccountVersionBoundedByCommits
INVARIANT IdleSetsEmpty
INVARIANT ReadyWorkerCommitOrRetry

PROPERTY ReadVersionMonotonic
PROPERTY Progress

CONSTANTS
  Accounts = {a1, a2}
  Workers = {w1, w2}
  Txs = {t1, t2}
  NoTx = no_tx
  MaxRetries = 2
