\* Buggy `main` model: the state root folds the whole in-memory RESIDENT set,
\* empty accounts included. Because residency of an empty account is node-local
\* (read-through / restart history), a restart role can fold a resident empty
\* that a never-restarted role never materialized — same block, different root.
\* Expectation: TLC PRODUCES a counterexample violating RootAgreement (the
\* block-2042 split-brain). TypeOK and StateRootInjective still hold — the root
\* stays an injective function of the folded set; the divergence is that the
\* folded set itself differs across roles.
SPECIFICATION Spec

CONSTANTS
    Roles = {producer, receiver, coldsync, restart, reorg}
    Accounts = {1, 2, 3}
    EmptyAccounts = {3}
    Base = 10
    MaxBlocks = 3
    FoldEmpties = TRUE

INVARIANT TypeOK
INVARIANT StateRootInjective
INVARIANT RootAgreement
