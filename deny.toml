# RM-B1 / WP-F3.1 (audit SUP-10): committed cargo-deny config so the
# license-and-supply-chain check is reproducible and reviewable in PRs,
# instead of being smuggled in via an inline heredoc inside CI.
#
# Rule of thumb: the `licenses.allow` list is the smallest set that
# permits the current dependency graph. Adding a new license requires
# a PR that updates this file — which forces reviewers to confirm the
# license is acceptable for downstream redistribution.

[licenses]
# SECREM-01: v2 licenses schema (matches the installed cargo-deny).
version = 2
# `confidence-threshold` is how confident cargo-deny needs to be before
# it accepts a detected license. 0.8 is the project default.
confidence-threshold = 0.8

# Allowed licenses. If a dependency reports a license not in this list,
# cargo-deny exits non-zero and the CI run fails (CI-04, CI-06).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # webpki-roots (Mozilla CA cert bundle) — permissive data license.
    "CDLA-Permissive-2.0",
]

# Explicit denies — block specific dependencies even if their license
# is in the allow-list. Add entries here if a transitive dep ships
# under a license the project shouldn't redistribute.
[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

# Some crates ship without an SPDX-detectable license file. These
# are vetted by hand and listed here so cargo-deny doesn't fail.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "encoding_rs"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [
    { path = "COPYRIGHT", hash = 0x39f8ad31 },
]

[advisories]
# RM-B1 / WP-F3.2 (audit CI-04, CI-06): treat unmaintained,
# yanked, and notice-level advisories as build failures. The CI
# step has no `|| true` and no `continue-on-error: true`, so any
# new RUSTSEC advisory blocks merges until triaged.
#
# RM-I / WP-I2.5 (re-audit Stream 7 doc-drift fix):
#   The header comment promised "treat unmaintained, yanked, and
#   notice-level advisories as build failures" but the config below
#   had `unmaintained = "warn"` and `notice = "warn"`. The 2026-04-25
#   re-audit caught the inconsistency. Now actually denied. Any
#   transitive dep that becomes unmaintained or carries a notice-level
#   advisory blocks merges until triaged or explicitly ignored below
#   with rationale.
# SECREM-01: migrated to the cargo-deny v2 advisories schema (the
# installed cargo-deny rejected the old `unmaintained = "deny"` /
# `notice = "deny"` keys — `unmaintained` now takes one of
# all|workspace|transitive|none, and `notice`/`vulnerability` were
# removed; vulnerabilities and yanked default to deny).
version = 2
yanked = "deny"
unmaintained = "all"
#
# Inline exceptions (each requires a one-line justification). These
# mirror the documented ignores in `audit.toml` / `cargo-audit.yml`
# (cargo-deny reads its own ignore list, so it must be duplicated here).
ignore = [
    # ruint Uint shift flags (RUSTSEC-2026-0220) — verified NOT EXPLOITABLE here.
    # The advisory affects overflowing/checked/strict/saturating shift FLAGS and
    # wrapping_sh* shift-amount truncation; the SHIFTED VALUES were correct.
    # citrate-chain calls none of those APIs (gated by
    # scripts/ci/ruint_shift_advisory_premise_tripwire.sh), and revm's SHL/SHR/SAR
    # clamp shift < 256 then use plain `<<`/`>>`/`arithmetic_shr`
    # (revm-interpreter-6.0.0/src/instructions/bitwise.rs:83-118). The to_base_be
    # DoS is no-alloc-only; we build std. Fix needs ruint>=1.20 -> proptest no_std
    # -> proptest 1.11+ -> rand 0.9, blocked on the `proptest = "=1.5.0"` pin
    # (BACKLOG #124); newest ruint under that pin is 1.11.0, still vulnerable.
    "RUSTSEC-2026-0220",
    # ruint reciprocal_mg10 OOB — verified FALSE POSITIVE for this repo
    # (alloy-primitives normalizes the divisor before the call; no direct
    # ruint use). Closes when alloy bumps ruint. REM-14. See audit.toml.
    "RUSTSEC-2025-0137",
    # tracing-subscriber <0.3.20 ANSI log injection — only the transitive
    # 0.2.25 from arkworks 0.4 is affected; direct deps are all on 0.3.
    # Closing needs an arkworks 0.4→0.6 bump (ZK review). REM-16b.
    "RUSTSEC-2025-0055",
    # ─── REM-21: unmaintained/deprecated TRANSITIVE deps (tracked for
    # rolling replacement; not build-blocking — see audit.toml). Each is
    # pulled transitively and has no in-tree fix without an upstream bump.
    "RUSTSEC-2025-0141",  # bincode unmaintained (1.3 → postcard, SUP-07)
    "RUSTSEC-2024-0388",  # derivative unmaintained
    "RUSTSEC-2024-0384",  # instant unmaintained (→ std::time / web-time)
    "RUSTSEC-2020-0016",  # net2 deprecated (→ socket2)
    "RUSTSEC-2025-0119",  # number_prefix unmaintained
    "RUSTSEC-2024-0436",  # paste unmaintained (→ pastey)
    "RUSTSEC-2026-0163",  # pqcrypto-internals unmaintained (PQClean archived)
    "RUSTSEC-2024-0381",  # (transitive unmaintained — REM-21)
    "RUSTSEC-2026-0162",  # (transitive unmaintained — REM-21)
    "RUSTSEC-2025-0124",  # (transitive unmaintained — REM-21)
]

[bans]
# Surface duplicate transitive deps; many duplicates are fine
# (e.g., `winapi` 0.2 vs 0.3) but tracking them keeps the graph
# from drifting silently.
multiple-versions = "warn"
# SECREM-01: workspace-internal deps are path deps with no version
# (intentionally `*`). allow-wildcard-paths does not apply to crates
# flagged publishable, and this repo defers crates.io publish until the
# chain audit (deps get versioned at release). Warn, do not block.
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"

[sources]
# Block any registry/git source other than crates.io + a small
# allow-list. Prevents a malicious PR from substituting a fork
# of a critical dep without anyone noticing.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # I64-S1: the Tier-1-audited federated/gradient Q16 kernel, consumed by
    # the `citrate-federated` parity crate (dev-deps only; pinned rev).
    "https://github.com/CitrateNetwork/citrate-fed-types",
]
