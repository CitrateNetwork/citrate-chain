[package]
edition = "2021"
name = "revm-precompile"
version = "8.0.0"
authors = ["Dragan Rakita <dragan0rakita@gmail.com>"]
description = "revm Precompiles - Ethereum compatible precompiled contracts"
readme = "README.md"
keywords = [
    "no_std",
    "ethereum",
    "evm",
    "revm",
    "precompiles",
]
license = "MIT"
repository = "https://github.com/bluealloy/revm"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[dependencies.aurora-engine-modexp]
version = "1.1"
default-features = false

[dependencies.blst]
version = "0.3.12"
optional = true

[dependencies.bn]
version = "0.6"
default-features = false
package = "substrate-bn"

[dependencies.c-kzg]
version = "1.0.2"
optional = true
default-features = false

[dependencies.k256]
version = "0.14"
features = ["ecdsa"]
default-features = false

[dependencies.once_cell]
version = "1.19"
features = ["alloc"]
default-features = false

[dependencies.p256]
version = "0.14"
features = ["ecdsa"]
optional = true
default-features = false

[dependencies.revm-primitives]
version = "5.0.0"
default-features = false

[dependencies.ripemd]
version = "0.1"
default-features = false

[dependencies.secp256k1]
version = ">=0.28, <=0.29"
features = [
    "alloc",
    "recovery",
    "rand",
    "global-context",
]
optional = true
default-features = false

[dependencies.sha2]
version = "0.10"
default-features = false

[features]
asm-keccak = ["revm-primitives/asm-keccak"]
blst = ["dep:blst"]
c-kzg = [
    "dep:c-kzg",
    "revm-primitives/c-kzg",
]
default = [
    "std",
    "c-kzg",
    "secp256k1",
    "portable",
    "blst",
]
hashbrown = ["revm-primitives/hashbrown"]
negate-optimism-default-handler = ["revm-primitives/negate-optimism-default-handler"]
optimism = [
    "revm-primitives/optimism",
    "secp256r1",
]
optimism-default-handler = [
    "optimism",
    "revm-primitives/optimism-default-handler",
]
portable = [
    "revm-primitives/portable",
    "c-kzg?/portable",
]
secp256k1 = ["dep:secp256k1"]
secp256r1 = ["dep:p256"]
std = [
    "revm-primitives/std",
    "k256/std",
    "once_cell/std",
    "ripemd/std",
    "sha2/std",
    "c-kzg?/std",
    "secp256k1?/std",
]

[lints.rust]
rust_2018_idioms = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.rustdoc]
all = "warn"
