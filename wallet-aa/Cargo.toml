[package]
name = "citrate-wallet-aa"
version = "0.4.0"
edition = "2021"
description = "Off-chain helpers for the Citrate ERC-4337 embedded-wallet stack — address prediction, Kernel init data, paymaster permit digest"
license = "Apache-2.0"

[dependencies]
# Hash primitives matching the EVM side
sha3 = "0.10"
hex = "0.4"

# secp256k1 ECDSA — used to construct EIP-191 signatures over the
# factory's permit digest from the operator wallet on auth.citrate.ai.
k256 = { version = "0.13", features = ["ecdsa", "ecdsa-core"] }
rand = { workspace = true }

# ABI helpers for the Kernel initialize() encoding + permit digest
# matching the on-chain `abi.encode(...)` shapes.
ethereum-types = "0.14"
ethabi = "18"

# Serialization for the helper structs that travel between
# auth.citrate.ai (Node) and consumers via JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "1"

[dev-dependencies]
# Bench / fuzz a tight set of vectors against the on-chain ABI shape.
proptest = { workspace = true }
