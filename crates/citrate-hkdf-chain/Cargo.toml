[package]
name = "citrate-hkdf-chain"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "DPF-14 — HKDF sub-secret chain (client-side derivation per HKDFSubSecretDerivation.tla). Each TenantHierarchy child node derives a sub-secret from (parent_secret, hkdf_salt, label) via HKDF-SHA-256."

[dependencies]
hkdf = "0.12"
sha2 = "0.10"
serde = { workspace = true }
thiserror = { workspace = true }
# SECREM-01 CRY-1: derived child key material must be wiped on drop.
# (Not in [workspace.dependencies] as of this sprint — pinned here.)
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
