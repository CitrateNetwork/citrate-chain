[package]
name = "citrate-consensus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
sha3 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Local dependencies
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
# WP-S.2: ECVRF-P256-SHA256 (RFC 9381)
# Audit M-05: p256 0.13 brings `zeroize` in transitively via the
# `arithmetic` feature (elliptic-curve's `Scalar` Zeroize impl is
# enabled when arithmetic is on). No explicit feature flag needed.
p256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
hmac = "0.12"
# Audit M-05: zeroize secret material in consensus crypto paths.
zeroize = { version = "1.7", features = ["zeroize_derive"] }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tokio-test = "0.4"
