[package]
name = "citrate-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
sha3 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rocksdb = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
bytes = "1.5"
blake3 = "1.5"

# Local dependencies
citrate-consensus = { path = "../consensus" }
citrate-execution = { path = "../execution" }

# Storage specific
lru = "0.17"
parking_lot = "0.12"
dashmap = "5.5"
hex = "0.4"
num_cpus = "1.16"
primitive-types = "0.12"
ethereum-types = "0.14"
chrono = "0.4"
aes-gcm = "0.10"
rand = { workspace = true }

# Quantum-Safe Storage Protocol (QSSP)
# Real post-quantum and classical cryptography
pqcrypto-kyber = "0.8"          # CRYSTALS-Kyber (ML-KEM) - NIST PQC standard
pqcrypto-traits = "0.3"         # Common traits for pqcrypto
x25519-dalek = { version = "2.0", features = ["static_secrets"] }  # X25519 ECDH
zeroize = { version = "1.7", features = ["derive"] }  # Secure memory zeroing + ZeroizeOnDrop derive (CRY-H1)
argon2 = "0.5"                  # Real Argon2id password-based key derivation

# Compression
zstd = "0.13"                   # Zstandard compression for IPFS storage

# IPFS daemon management
dirs = "5.0"                    # Platform-specific directories
flate2 = "1.0"                  # Gzip decompression for tar.gz
tar = "0.4"                     # Tar archive extraction
zip = "2.0"                     # ZIP archive extraction (Windows)

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
rand = { workspace = true }
proptest = { workspace = true }

[features]
no-compression = []
