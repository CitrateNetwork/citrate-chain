[package]
name = "citrate-federated"
version = "0.1.0"
edition = "2021"
publish = false

# I64-S1 WP-A1/WP-B3 — the seam where the chain's consensus Q16 meets the
# `citrate-fed-types` kernel Q16. This crate exists ONLY to host the
# bit-parity proof between the two implementations; it is intentionally
# NOT in the workspace `default-members`, so the everyday
# `cargo build`/`cargo test` (default-members) stays free of the kernel
# git dependency. It is also excluded from the root workspace, so run the
# parity proof with `cargo test --manifest-path core/federated/Cargo.toml`.
[dependencies]

[dev-dependencies]
# The chain's consensus Q16 (the type compiled into the node binary).
citrate-execution = { path = "../execution" }
# The Tier-1-audited federated/gradient kernel Q16. Pinned to the
# remediated rev so the parity proof is reproducible. 6d1c3985 is the
# post-rewrite equivalent of the earlier pin dbbfbff2, which the remote no
# longer serves: same source tree, only Cargo.toml `authors` differs.
# Federation [[drift]] row: citrate-chain -> citrate-fed-types. Fetched with
# `[net] git-fetch-with-cli = true` (see .cargo/config.toml).
citrate-fed-types = { git = "https://github.com/CitrateNetwork/citrate-fed-types.git", rev = "6d1c39850a66db469933f5fdb16a1d172a4b35ce" }

[lib]
path = "src/lib.rs"
