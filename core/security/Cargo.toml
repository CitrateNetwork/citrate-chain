[package]
name = "citrate-security"
version = "0.4.0"
edition = "2021"
description = "Citrate security primitives — AEAD wrapper, secret-lifecycle helpers"
license = "Apache-2.0"

[lib]
name = "citrate_security"
path = "src/lib.rs"

[dependencies]
# AEAD primitive — same version pinned across the workspace.
aes-gcm = "0.10"

# Audit finding WAL-04: zeroize secret material on drop.
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Audit finding CX-02: constant-time byte comparison.
subtle = "2.5"

# Error handling
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
