[package]
name = "citrate-signing"
version = "0.1.0"
edition = "2021"
description = "Signing-service provider abstraction for Citrate IT-Turnkey bootstrap. Default backend: Docusign + CLEAR Risk-Based Verification."

[dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockito = "1"
