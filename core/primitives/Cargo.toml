[package]
# PSL-03 (partial): renamed from `primitives` to `citrate-primitives` on
# 2026-05-18. The bare `primitives` name was too generic for an eventual
# crates.io publish. crates.io publish itself is blocked on the chain
# audit (per D6 release policy); this rename stages the work so publish
# is a one-step operation when the audit clears.
name = "citrate-primitives"
version = "0.4.0"
edition = "2024"
description = "Citrate Network: core primitive types and utilities. (Placeholder during federation transition — substantive content arrives with subsequent chain releases.)"
license = "Apache-2.0"
repository = "https://github.com/CitrateNetwork/citrate-chain"

