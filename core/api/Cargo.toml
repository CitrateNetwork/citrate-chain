[package]
name = "citrate-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
prometheus = { version = "0.13", default-features = false }
once_cell = "1.19"

# Local dependencies
citrate-consensus = { path = "../consensus" }
citrate-sequencer = { path = "../sequencer" }
citrate-network = { path = "../network" }
citrate-execution = { path = "../execution" }
citrate-storage = { path = "../storage" }
citrate-economics = { path = "../economics" }
citrate-mcp = { path = "../mcp" }

# RPC Server
jsonrpc-core = "18.0"
jsonrpc-http-server = "18.0"
jsonrpc-ws-server = "18.0"
jsonrpc-derive = "18.0"

# Web Framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Rate limiting
dashmap = "5.5"

# Additional
dirs = "5.0"
hex = "0.4"
futures = "0.3"
primitive-types = "0.12"
bincode = { workspace = true }
rand = { workspace = true }
sha3 = "0.10"
rlp = "0.5"
ethereum-types = "0.14"
secp256k1 = { version = "0.27", features = ["recovery"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = "0.21"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }

# REM-13b (2026-05-20 federation-split audit): removed `ethers-solc`
# + `semver` optional deps and their `verifier-ethers-solc` feature
# flag. Both were dead weight:
#   * `ethers-solc` was never `use`'d in any source file. Earlier
#     attempts to call ethers_solc's API were abandoned; a comment
#     at server.rs:266 explained the route went to external `solc`
#     "for compatibility with ethers-solc v2 API changes".
#   * `semver` was only declared because the `verifier-ethers-solc`
#     feature listed it; it was never imported either.
#   * Both feature-gated and ungated `compile_runtime_bytecode`
#     variants delegated to `compile_runtime_bytecode_external`,
#     which shells out to `solc` via `std::process::Command`.
# Removing the feature drops the entire transitive vulnerable dep
# tree (reqwest 0.11 → tokio-rustls 0.24 → rustls-webpki 0.101.7 →
# 4 RUSTSEC advisories per F-05) without changing runtime behavior.
# See REM-13b in:
# citrate-agentile-archive/audits/2026-05/2026-05-19-federation-split-audit/06_REMEDIATION_PLAN.md

[features]
default = []

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"
tempfile = "3.0"
tower = { version = "0.4", features = ["util"] }
proptest = { workspace = true }
hex = "0.4"
# SECREM-01 INFER-1: signing test vectors for inference_auth (matches the
# k256 recovery used by citrate-execution's recover_address).
k256 = { version = "0.13", features = ["ecdsa"] }
