[package]
name = "citrate-execution"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
sha3 = { workspace = true }
sha2 = "0.10"
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Additional
futures = "0.3"
citrate-consensus = { path = "../consensus" }

# Execution specific
primitive-types = { version = "0.12", features = ["serde"] }
ethereum-types = "0.14"
rlp = "0.5"
hex = "0.4"
dashmap = "5.5"
parking_lot = "0.12"
lru = "0.16"
prometheus = { version = "0.13", default-features = false }
once_cell = "1.19"

# Battle-tested EVM implementation (used by Foundry/Anvil).
#
# Pinned to 10 — Dependabot PR #69 (merged 2026-04-22) bumped to 20,
# which is a breaking API change: `revm::primitives::*` was
# reorganized, `Evm` moved, `AccountInfo` / `Bytecode` / `TransactTo`
# / `SpecId` are now under `revm_primitives`. `src/revm_adapter.rs`
# uses the v10 API. Adapting to v20 is tracked as a dedicated sprint
# item; pinning back to 10 restores the release build. See BACKLOG
# #126.
revm = { version = "=10", default-features = false, features = ["std", "serde"] }

# Tensor operations
ndarray = "0.15"
ndarray-rand = "0.14"

# RM-M1b — Halo2-KZG inference-proof substrate. Optional, gated by
# the `halo2-substrate` feature. See ADR-RM-M1b-1.
halo2_proofs = { workspace = true, optional = true }
halo2curves = { workspace = true, optional = true }

# citrate-chain#170 (M3) — the Nova recursive-fold CommD verifier for the 0x0130 precompile. Optional,
# gated by `commd-fold-verify`; OFF by default so Nova (halo2curves 0.9) stays OUT of the default build.
# It is its own workspace (keeps the prover isolated); path-dep'd here only when the feature is enabled.
citrate-commd-verify = { path = "../../crates/citrate-commd-verify", optional = true }

# Zero-knowledge proofs (experimental — circuits are placeholder implementations)
# Production Groth16 verification gated behind `zkp_production` in core/mcp
# Arkworks suite — all crates pinned to the 0.4 line so the ecosystem
# is internally consistent. Dependabot bumped ark-std and ark-relations
# to 0.5 (PRs #68, #70), but ark-groth16/ark-r1cs-std/ark-bls12-381
# don't have 0.5 releases yet, so mixing creates unresolvable trait
# bounds (e.g. `ark-ff::Fp<...>: ark-relations::r1cs::Field`). Lock all
# to 0.4 until the whole ecosystem moves together.
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-poly = "0.4"
ark-serialize = "0.4"
ark-groth16 = "0.4"
ark-r1cs-std = "0.4"
ark-relations = "0.4"
ark-bls12-381 = "0.4"
ark-snark = "0.4"

# Cryptography
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
rand = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa", "sha256", "ecdh"] }
ed25519-dalek = { workspace = true }   # 0x0120 Ed25519 verify precompile (is_weak + verify_strict)

# Precompile implementations
ripemd = "0.1"                # RIPEMD-160 hash
num-bigint = "0.4"            # MODEXP big integer operations
num-traits = "0.2"            # Numeric traits
ark-bn254 = "0.4"             # BN254 curve for ECADD/ECMUL/ECPAIRING
blake2 = "0.10"               # BLAKE2F compression
ark-crypto-primitives = { version = "0.4", features = ["sponge", "r1cs"] }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tokio-test = "0.4"
proptest = { workspace = true }
rand = { workspace = true }
criterion = { workspace = true }
# citrate-chain#170: parity guard — the canonical CommD crate's Poseidon-BN254 and
# Merkle must stay byte-identical to this crate's frozen poseidon_bn254 / merkle_root_4.
citrate-commd = { path = "../../crates/citrate-commd" }

[[bench]]
name = "parallel_bench"
harness = false

[[bench]]
name = "mvcc_bench"
harness = false

[[bench]]
name = "tps_parallel"
harness = false

# PIN-P1 (f.5) — DGX benchmark suite.
# Measures the per-stage costs that drive the feasibility inequalities
# from `design/PIN-P1-feasibility-latency-budget.md`:
#   honest_PoSt_prove + tx_latency < W < t_reseal
[[bench]]
name = "porep_bench"
harness = false
required-features = ["halo2-substrate"]

# PIN-S6 — the out-of-process sealing/proving sidecar the pinning daemon drives.
# Carries the reduced-circuit prover, so it needs the halo2 feature; the default
# build (and every node binary) does NOT include it.
[[bin]]
name = "citrate-sealer"
path = "src/bin/citrate-sealer.rs"
required-features = ["halo2-substrate"]

[features]
metrics = []
ai_zkp = []
coreml = []  # Enable CoreML support on macOS

# RM-M1b — Halo2-KZG inference-proof substrate.
# OFF by default in RM-M1 close. The flag exists so dependent code
# can be authored against `halo2::*` interfaces (see
# core/execution/src/zkp/halo2/mod.rs) without pulling in the
# halo2_proofs / halo2curves deps until a specific PSE Halo2
# commit is pinned in WP-M1b.1.
#
# When the pin is set, this feature gains:
#   halo2-substrate = ["dep:halo2_proofs", "dep:halo2curves"]
# AND the `[dependencies]` section above gains optional entries for
# both. See ADR-RM-M1b-1 for the chosen substrate (Aztec Ignition
# SRS over BN254).
halo2-substrate = ["dep:halo2_proofs", "dep:halo2curves"]

# citrate-chain#170 (M3) — the 0x0130 recursive-fold CommD proof verifier. OFF by default: enabling it
# links the Nova verifier (`citrate-commd-verify`, validated to coexist with the pinned PSE-halo2 stack)
# and embeds the SINGLE baked verifier key. Turning it on is a CONSENSUS change (all nodes must agree),
# so it ships behind a coordinated activation. Requires `crates/citrate-commd-fold`'s `bake_vk` tool to
# have produced `core/execution/artifacts/commd_fold_vk.bin` from a trusted-setup .ptau (the feature
# build `include_bytes!`s it and fails if absent — you cannot verify without a key).
commd-fold-verify = ["dep:citrate-commd-verify"]

# RM-E.1 / CHAIN-003 — explicit opt-in for the INSECURE deterministic
# seed-based KZG SRS (`StdRng::from_seed([0x4D;32])`) used by the 0x0108
# verifier when no ceremony `.ptau` is configured. The toxic waste of a
# seeded SRS is reproducible, so it must NEVER be reachable in a
# production validator. The seed path is allowed only in debug builds
# (`debug_assertions`, i.e. tests/local) OR when this feature is set
# explicitly for a release devnet build. A release build with neither
# REFUSES to serve 0x0108 unless CITRATE_PTAU_PATH points at a verified
# ceremony file (fail closed). Never enable this in production.
insecure-dev-srs = []

# Note: the former `mvcc` feature flag was removed in Sprint P950-A-3
# (2026-04-21). MVCC is now the only execution path; the tokio::sync::Mutex
# serialization was deleted. Verified by
# specs/tla/consensus/ExecutorMVCC.tla (14 safety + 1 action + 1 liveness).
