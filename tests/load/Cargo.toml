[package]
name = "citrate-load-test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "load-test"
path = "src/main.rs"

[[bin]]
name = "benchmark-suite"
path = "src/bin/benchmark_suite.rs"

[[bin]]
name = "live-bench"
path = "src/bin/live_bench.rs"

[[bin]]
name = "bench-signed"
path = "src/bin/bench_signed.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
rand = "0.8"
futures = "0.3"
chrono = "0.4"
# bench-signed: self-sign EIP-155 legacy transactions
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rlp = "0.5"
hex = "0.4"

[workspace]
